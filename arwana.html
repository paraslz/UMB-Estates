<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Arwana Estate - Plantation, Agronomy and Audit Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; } /* dark green */
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div id="header-title" class="text-xl font-bold text-gray-900">
                Arwana Estate Report
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Registering the datalabels plugin globally or it can be done specifically per chart
            Chart.register(ChartDataLabels);

            const estateData = {
                "id": "arwana",
                "name": "Arwana Estate (Inti)",
                "reportInfo": "Data based on PA Report (August 2026), Audit Report (April 2026) & Agronomy Report (April 2025).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area (Aug 2026)",
                        "lines": [
                            "Total Planted: 1,450.34 ha",
                            "Mature: 1,000.73 ha",
                            "Immature: 449.61 ha",
                            "Productive: 589 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (MT)",
                        "type": "chart",
                        "canvasId": "miniYieldChart",
                        "note": "*FY2025/26 (May-Apr) Actual vs Budget"
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne",
                        "value": "RM 572.00 / RM 409.00",
                        "note": "Actual vs Budget Ex-Estate (Ref: PAR Pg. 42)"
                    },
                    "audit_loss": {
                        "title": "Audit Overpayments",
                        "value": "IDR 26.2M",
                        "note": "Recoverable (Ref: Audit Pg. 3, 12)"
                    },
                     "pests": {
                        "title": "Pest Status",
                        "value": "High (Rats)",
                        "note": "20% damage, baiting not yet done (Ref: PAR Pg. 31)"
                    }
                },
                "keyMetrics": [
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>`, "label": "Control Rating", "value": "Deficient (IAD)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>`, "label": "Labour Ratio", "value": "1:9 ha (Satisfactory)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>`, "label": "Harvest Interval", "value": "14 days" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-orange-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`, "label": "Contractor Fraud", "value": "IDR 17.2M Loss" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>`, "label": "Harvester Prod.", "value": "6.6 hrs/day (Low)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>`, "label": "Production YTD", "value": "101% of Budget" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["2019/20", "2020/21", "2021/22", "2022/23", "2023/24", "2024/25", "2025/26 (12M)"],
                        "ffb": [1.17, 2.99, 4.20, 5.72, 9.61, 9.14, 10.62],
                        "note": "*FFB Performance trend (Source: PAR 2/2026 Pg. 40)"
                    },
                    "ageProfile": {
                        "labels": ["Mature (69%)", "Immature (31%)"],
                        "data": [69, 31],
                        "title": "Arwana Estate - Palm Age Distribution",
                        "note": "*Source: PAR 2/2026, Pg. 10."
                    }
                },
                "observations": [
                    "<b>Audit Rating - Deficient:</b> Internal Audit rated Arwana as 'Deficient' due to significant control weaknesses in contract management and field maintenance supervision. <span class='observation-ref'>(Audit Report Pg. 1, 2)</span>",
                    "<b>Massive OPEX Overruns:</b> Ex-Estate cost is highly over budget at RM 572/MT vs RM 409/MT. General Charges are 131% over budget (driven by MSPO compliance and utility allocations), and Upkeep is 10% overspent. <span class='observation-ref'>(PAR Pg. 15, 42)</span>",
                    "<b>Severe Manuring Delays:</b> Only 30% of manuring rounds (167 out of 550) were completed. This is due to reliance on depleting old stock and delayed delivery caused by transport issues. Both Agronomy and PA reports emphasize this as a yield risk. Semi-mechanization is strongly recommended. <span class='observation-ref'>(AR Pg. 17-18; PAR Pg. 30)</span>",
                    "<b>High Rat Damage:</b> Census indicates a high rat damage rate of roughly 20%, well above the 10% threshold. However, rat baiting has not yet commenced. <span class='observation-ref'>(PAR Pg. 31)</span>",
                    "<b>Low Harvester Productivity:</b> Harvesters are only working an average of 6.6 hours per day. Management must monitor workers closely and is urged to implement mechanical in-field FFB collection to boost productivity. <span class='observation-ref'>(PAR Pg. 39)</span>",
                    "<b>Production Performance:</b> Yield has marginally exceeded the budget, hitting 10.62 MT/ha (101% of budget) and improving 16% over the prior year, despite the rehabilitation areas remaining non-productive. <span class='observation-ref'>(PAR Pg. 40)</span>"
                ],
                "reports": {
                    "audit": {
                        "Executive Summary": "Arwana Estate is rated as Deficient. Key controls were not being applied, significantly impairing the overall internal control system. Issues were identified in Contracts & Tenders, Field Maintenance, and Payroll & Personnel. (Audit Report, Pg. 1-2)",
                        "Contract Management": "Excavator operator (CV Dua Putri Kalimantan) manipulated running hour meters. Actual vs Reported variances resulted in IDR 17.2M overpayment. Contractor has been blacklisted from PT LAK hereafter. (Audit Report, Pg. 2-5)",
                        "Field Maintenance Failures": "Lack of periodic maintenance after restacking works (IDR 409M total spend) led to inaccessible areas. 1,685 seedlings died in Div 1B due to poor supervision. Warnings were issued to Assistant Managers and Field Managers. (Audit Report, Pg. 5-11)",
                        "Payroll Overpayment": "IDR 8,994,863 overpaid due to wrong worker status classification and failure to reconcile piece-rated work against Area Statement palm stands. (Audit Report, Pg. 12-16)"
                    },
                    "plantation": {
                        "Executive Summary": "The estate achieved 10,630 MT FFB (101% of budget), producing 10.62 MT/ha. However, the cost of production (RM 572/MT) is alarmingly over budget by RM 163/MT, heavily driven by General Charges. Manuring is severely delayed, and harvesters' daily productivity requires strict monitoring. (PA Report, Pg. 4, 40-42)",
                        "Area Statement": "As of April 2026, the total planted area remains 1,450.34 ha.<br>• <b>Mature:</b> 1,000.73 ha (only 589 ha currently productive).<br>• <b>Immature:</b> 449.61 ha.<br>• <b>Rehabilitation:</b> 69 ha completed out of 177 ha targeted for FY26/27. (PA Report, Pg. 10)",
                        "Labour Statement": "Actual workforce is 102 vs requirement of 140. Overall ratio is 1:9 ha (Satisfactory).<br>• <b>Harvesters:</b> 35 available, which is adequate for the 589 ha of productive land (Ratio 1:18 ha).<br>• <b>Manuring:</b> 6 available vs 11 required. (PA Report, Pg. 12-13)",
                        "Staff Establishment": "The staff establishment is adequate. Personnel include 1 Estate Manager (Bpk Ismanto Arga), 1 Askep (Rafael Raya), 2 Assistants, and 1 KTU. (PA Report, Pg. 14)",
                        "General Charges": "Total General Charges reached RM 2,309,158, overspent by an incredible 131%.<br>• <b>MSPO Compliance:</b> Overspent by 5396% for mandatory safety clothing/equipment (unbudgeted).<br>• <b>Water/Electricity:</b> +113% due to allocation from the mill.<br>• <b>Wages:</b> +21% due to unbudgeted hires (mosque/fire watchmen, office boy). (PA Report, Pg. 15-16)",
                        "Upkeep and Cultivation": "Total maintenance is overspent by 10%.<br>• <b>Weeding:</b> Circle spraying (86% completed) shows low productivity at 3.1 ha/man-day; water is inefficiently sourced from drains. Selective spraying is 98% complete and satisfactory.<br>• <b>Manuring:</b> Only 167 out of 550 rounds (30%) achieved due to priority shifting and fertilizer delivery delays. <br>• <b>Pest & Disease:</b> Rat damage census averages 20% but baiting had not yet commenced. (PA Report, Pg. 18-32)",
                        "Harvesting and Collection": "Productivity and output require intervention.<br>• <b>Interval:</b> Averaged 14 days (intentionally delayed by Manager to manage drought-induced slow ripening).<br>• <b>Productivity:</b> Harvesters only work an average of 6.6 hours/day. Mechanical in-field evacuation is recommended.<br>• <b>Internal Transport:</b> High cost due to excessive tractor reliance vs contracted trucks. (PA Report, Pg. 38-39)",
                        "Crop Production": "FY2025/26 (12 Months) FFB Production is 10,630 MT (101% of 10,574 MT budget).<br>• <b>Yield/Ha:</b> 10.62 MT/ha (16% increase YoY).<br>• <b>Extraction:</b> OER at 20.19% vs Budget 21.50%. (PA Report, Pg. 40)",
                        "Production Cost": "Ex-Estate Cost of Production is RM 572/MT, well over the budget of RM 409/MT.<br>• <b>General Charges:</b> RM 217/MT vs RM 94/MT budget.<br>• <b>Upkeep:</b> RM 274/MT vs RM 249/MT budget.<br>• <b>Harvesting:</b> RM 81/MT vs RM 66/MT budget. (PA Report, Pg. 42)",
                        "Vehicles Running Cost": "Vehicle running costs were satisfactory and in line with budget allocations across tractors and gensets. (PA Report, Pg. 43)",
                        "Capital Expenditure": "Underspent. However, road maintenance budgeting errors led to CAPEX items being improperly charged to Upkeep OPEX. (PA Report, Pg. 44)",
                        "Immature & Nursery": "• <b>Immature:</b> P23/24/25 blocks display clean circles and inter-rows. <br>• <b>Nursery:</b> Well established. Culling rate is 5.4%. Cost to date is RM 6.98/seedling. Fungal infections prevented with weekly Decis/fungicide sprays. (PA Report, Pg. 45-52)"
                    },
                    "agronomy": {
                        "Executive Summary": "Yields remain far below expectations. Primary factors are poor crop recovery and chronic manuring delays. (AR, Pg. 4-6)",
                        "Nutrient Inputs Progress Of Manuring": "FY24/25 program severely delayed (40% complete) due to late deliveries and flooding. (AR, Pg. 17-18)",
                        "Agronomic Observation": "Unsatisfactory ground vegetation control. Rotten bunches observed due to poor recovery. (AR, Pg. 25, 38, 49)",
                        "Yield Performance": "Yield reached 7.62 MT/ha (May-Mar FY24/25), increase of 16.8% but still underperforming. (AR, Pg. 65)",
                        "Fertilizer Recommendation": "FY25/26 program adjusted to three rounds for backlogged blocks. (AR, Pg. 70, 72-73)"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Contract Management</p><p class='text-sm text-gray-600'><b>Policy Ref: CON-VER-01:</b> All contractor claims for rented machinery must be supported by daily timesheets and photographic evidence of hour meters verified by the Assistant Manager and Field Mandore.</p></div> <div class='policy-item'><p class='font-semibold'>Payroll Verification</p><p class='text-sm text-gray-600'><b>Policy Ref: PAY-RECON-05:</b> Piece-rated work output (palms/ha) must be reconciled against the approved Area Statement before payroll processing to prevent overpayment.</p></div> <div class='policy-item'><p class='font-semibold'>Manuring & Fertilizing</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-APP-05:</b> All manuring programs must be completed within the financial year. Any delays require a formal report and a catch-up plan.</p></div>"
            };

            const container = document.getElementById('selected-estate-container');
            let chartInstances = {};

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeCharts();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' : 
                                       metric.title.includes('Overpayments') ? 'bg-red-50 text-red-800' : 'bg-gray-50 text-gray-800';
                    
                    if (metric.type === 'chart') {
                        return `
                        <div class="p-4 rounded-lg ${colorClass} shadow-sm border border-opacity-10 border-black flex flex-col justify-between">
                            <h3 class="font-semibold text-sm uppercase tracking-wider mb-2">${metric.title}</h3>
                            <div class="relative h-32 w-full mt-auto">
                                <canvas id="${metric.canvasId}"></canvas>
                            </div>
                            <p class="text-xs opacity-75 mt-2 text-center">${metric.note}</p>
                        </div>`;
                    } else if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass} shadow-sm border border-opacity-10 border-black flex flex-col"><h3 class="font-semibold text-sm uppercase tracking-wider mb-2">${metric.title}</h3><div class="flex-grow flex flex-col justify-center">${metric.lines.map(line => `<p class="text-sm font-medium leading-relaxed">${line}</p>`).join('')}</div></div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass} shadow-sm border border-opacity-10 border-black flex flex-col"><h3 class="font-semibold text-sm uppercase tracking-wider">${metric.title}</h3><div class="flex-grow flex flex-col justify-center"><p class="text-2xl font-bold mt-1">${metric.value}</p><p class="text-xs opacity-75 mt-1">${metric.note}</p></div></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-200 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-xs text-gray-500 uppercase font-semibold">${metric.label}</p><p class="font-bold text-gray-800">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="pl-2">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 md:p-10 rounded-2xl shadow-xl animate-fade-in border border-gray-100">
                        <div class="mb-8 border-b pb-4">
                            <h2 class="text-4xl font-extrabold text-gray-900">${estate.name}</h2>
                            <p class="text-md text-gray-500 mt-2 font-medium flex items-center italic">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                ${estate.reportInfo}
                            </p>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-5 mb-10">${summaryMetricsHTML}</div>

                        <div class="mb-10">
                            <h3 class="text-2xl font-bold mb-6 text-gray-800 flex items-center border-b pb-2">
                                <span class="w-8 h-8 bg-green-100 text-green-700 rounded-lg flex items-center justify-center mr-3 text-base">📊</span>
                                Key Metrics & Control Status
                            </h3>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">${keyMetricsHTML}</div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-10">
                            <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200">
                                <h3 class="text-lg font-bold mb-4 text-gray-700">Historical FFB Yield (MT/Ha)</h3>
                                <div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div>
                                <p class="text-xs text-center text-gray-400 mt-4">${estate.chartData.production.note}</p>
                            </div>
                            <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200">
                                <h3 class="text-lg font-bold mb-4 text-gray-700">Palm Age Profile</h3>
                                <div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div>
                                <p class="text-xs text-center text-gray-400 mt-4">${estate.chartData.ageProfile.note}</p>
                            </div>
                        </div>
                        
                        <div class="mb-12">
                            <h3 class="text-2xl font-bold mb-6 text-gray-800 flex items-center border-b pb-2">
                                <span class="w-8 h-8 bg-red-100 text-red-700 rounded-lg flex items-center justify-center mr-3 text-base">⚠️</span>
                                Key Observations & Issues
                            </h3>
                            <div class="bg-white border-l-4 border-red-500 p-2 rounded-r-xl">
                                <ul class="list-disc list-outside space-y-4 text-gray-700 ml-6">${observationsHTML}</ul>
                            </div>
                        </div>
                        
                        <div class="mb-12 text-center">
                            <button class="policy-modal-btn bg-green-800 text-white px-8 py-4 rounded-xl hover:bg-green-900 transition-all shadow-lg font-semibold hover:-translate-y-1">
                                View Control & Agricultural Policy Cross-Reference
                            </button>
                        </div>

                        <div class="space-y-4">
                            <div class="section-group">
                                <button data-dropdown-id="${estate.id}-audit" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-bold shadow-md">
                                    Internal Audit Report Details (Apr 2026)
                                </button>
                                <div id="${estate.id}-audit" class="details-content bg-gray-50 p-6 rounded-b-xl border border-gray-200 shadow-inner mt-1"></div>
                            </div>

                            <div class="section-group">
                                <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-bold shadow-md">
                                    Plantation Advisory Report Details
                                </button>
                                <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-6 rounded-b-xl border border-gray-200 shadow-inner mt-1"></div>
                            </div>

                            <div class="section-group">
                                <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-bold shadow-md">
                                    Agronomy Report Details
                                </button>
                                <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-6 rounded-b-xl border border-gray-200 shadow-inner mt-1"></div>
                            </div>

                            <div class="section-group">
                                <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-bold shadow-md">
                                    Pinfosys Report Details
                                </button>
                                <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-6 rounded-b-xl border border-gray-200 shadow-inner mt-1"></div>
                            </div>
                        </div>
                    </div>`;
            }

            function initializeCharts() {
                // Initialize Mini Yield Chart
                if (estateData.summaryMetrics.yield && estateData.summaryMetrics.yield.type === 'chart') {
                    const miniCtx = document.getElementById(estateData.summaryMetrics.yield.canvasId)?.getContext('2d');
                    if (miniCtx) {
                        chartInstances['miniYield'] = new Chart(miniCtx, {
                            type: 'bar',
                            data: {
                                labels: ['FY 24/25', 'FY 25/26'],
                                datasets: [
                                    {
                                        label: 'Actual',
                                        data: [9.14, 10.62],
                                        backgroundColor: '#16a34a',
                                        borderRadius: 4,
                                        barPercentage: 0.7,
                                        categoryPercentage: 0.8
                                    },
                                    {
                                        label: 'Budget',
                                        data: [13.00, 10.57],
                                        backgroundColor: '#94a3b8',
                                        borderRadius: 4,
                                        barPercentage: 0.7,
                                        categoryPercentage: 0.8
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: {
                                        display: true,
                                        position: 'bottom',
                                        labels: { boxWidth: 10, padding: 5, font: { size: 10 } }
                                    },
                                    datalabels: {
                                        anchor: 'end',
                                        align: 'top',
                                        color: '#475569',
                                        font: { weight: 'bold', size: 10 },
                                        formatter: (val) => val.toFixed(2)
                                    },
                                    tooltip: { enabled: true }
                                },
                                scales: {
                                    x: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 10 } } },
                                    y: { display: false, beginAtZero: true, max: 15 } // Give headroom for labels
                                },
                                layout: { padding: { top: 20 } }
                            }
                        });
                    }
                }

                const prodCtx = document.getElementById(`prodChart-${estateData.id}`)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[`prodChart-${estateData.id}`] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [{ label: 'FFB Yield (MT/Ha)', data: estateData.chartData.production.ffb, backgroundColor: '#16a34a', borderRadius: 6 }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { 
                                legend: { display: false },
                                datalabels: { display: false } // Disable datalabels for main chart
                            }, 
                            scales: { y: { beginAtZero: true, title: { display: true, text: 'MT/Ha' } } } 
                        }
                    });
                }

                const ageCtx = document.getElementById(`ageChart-${estateData.id}`)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[`ageChart-${estateData.id}`] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#047857', '#34d399', '#a7f3d0'], hoverOffset: 10 }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { 
                                legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15 } },
                                datalabels: { display: false } // Disable datalabels for main chart
                            } 
                        }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const auditDiv = document.getElementById(`${estateData.id}-audit`);
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);

                if (auditDiv && estateData.reports.audit) {
                    auditDiv.innerHTML = Object.entries(estateData.reports.audit).map(([section, content]) => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-bold text-gray-800 pb-1 mb-1 font-['Inter']">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4>
                            <p class="text-sm text-gray-600 leading-relaxed font-['Inter']">${content}</p>
                        </div>`).join('');
                }
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-bold text-gray-800 pb-1 mb-1 font-['Inter']">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4>
                            <p class="text-sm text-gray-600 leading-relaxed font-['Inter']">${content}</p>
                        </div>`).join('');
                }
                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-bold text-gray-800 pb-1 mb-1 font-['Inter']">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4>
                            <p class="text-sm text-gray-600 leading-relaxed font-['Inter']">${content}</p>
                        </div>`).join('');
                }
                if (pinfosysDiv) {
                    pinfosysDiv.innerHTML = typeof estateData.reports.pinfosys === 'string' ? `<p class="text-sm text-gray-500 italic font-['Inter']">${estateData.reports.pinfosys}</p>` : "";
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        const isActive = content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active', isActive);
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estateData));
            }

            renderEstate();
        });
        
        function openPolicyModal(estate) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Control & Policy Cross-Reference: ${estate.name}`;
            modalContent.innerHTML = estate.policy;
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
