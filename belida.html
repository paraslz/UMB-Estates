<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Belida Estate - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Belida Estate (Inti) Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <!-- Container where the estate data will be rendered -->
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for displaying policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Main script for application logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof ChartDataLabels !== 'undefined') {
                Chart.register(ChartDataLabels);
            }

            // --- DATA STORE ---
            const estateData = {
                "id": "belida",
                "name": "Belida Estate (Inti)",
                "reportInfo": "Data based on PA Report (Visit: August 2026) & Agronomy Report (Visit: May 2026).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 958.78 ha",
                            "Mature: 955.80 ha",
                            "Immature: 2.98 ha",
                            "Non-Cultivated: 109.15 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (MT)",
                        "type": "chart",
                        "canvasId": "miniYieldChart",
                        "note": "*FY 25/26 (May 25 - Apr 26) only"
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne (Actual vs Budget)",
                        "value": "RM 305.98 / RM 254.60",
                        "note": "Ex-Estate, 12M (20% above budget)"
                    },
                    "weeding": {
                        "title": "Weeding & Manuring",
                        "value": "99% / 100%",
                        "note": "Circle Spraying (99%) & Manuring (100%)"
                    },
                    "pests": {
                        "title": "Pest & Disease Status",
                        "value": "Controlled",
                        "note": "Minimal rat attack; No bagworm outbreak"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Labour Ratio", "value": "1:7 ha (Harvester 1:16 ha - Jul '26)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "P&D Status", "value": "Satisfactory (Minimal Rat Attack)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>", "label": "OER % (FY 25/26)", "value": "20.01% (vs 21.50% Budget)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Harvester Prod.", "value": "2.08 - 2.33 MT/md (Improved Jul '26)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Harvest Interval", "value": "13 - 24 Days (Delayed in Apr/Jul '26)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-teal-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17.657 18.343A8 8 0 016.343 7.029m11.314 11.314a8 8 0 01-11.314-11.314m2.121 13.435a2 2 0 01-2.828 0l-2.122-2.121a2 2 0 010-2.828l5.656-5.657a2 2 0 012.829 0l2.121 2.121a2 2 0 010 2.828l-5.657 5.657z' /></svg>", "label": "Nutrient Status", "value": "100% Completed (1,406.73 MT)" }
                ],
                "chartData": {
                    "miniYield": {
                        "labels": ["2024/25", "2025/26"],
                        "actual": [28.99, 23.69],
                        "budget": [null, 28.25]
                    },
                    "production": {
                        "labels": ["FY 24/25 Actual", "FY 25/26 Budget", "FY 25/26 Actual"],
                        "ffb": [27712.07, 26997.89, 22647.49],
                        "cpo": [5819.54, 5804.55, 4531.76],
                        "note": "*Full 12-Month FFB and CPO production comparison (May 2025 - April 2026 vs FY 2024/25). Source: PA Report 2/2026, Pg. 55."
                    },
                    "ageProfile": {
                        "labels": ["2008 (13.44%)", "2012 (80.84%)", "2013 (4.71%)", "2020 (0.71%)", "2023 Immature (0.31%)"],
                        "data": [128.82, 775.06, 45.16, 6.76, 2.98],
                        "title": "Belida Estate - Palm Age Distribution (Aug 2026)",
                        "note": "*Source: PA Report 2/2026, Pg. 13 & Agronomy Report 1/2026, Pg. 10."
                    }
                },
                "observations": [
                    "<b>Low Crop Production & Yield Decline:</b> Total 12-month FFB production reached 22,647.49 MT (23.69 MT/ha), which is 16% below the annual budget of 26,997.89 MT (28.25 MT/ha) and 18% lower than FY 2024/25 (28.99 MT/ha). Agronomic analysis attributes this decline primarily to a 30.33% reduction in bunch numbers per palm (10.86 bunches/palm). <span class='observation-ref'>(PA Report 2/2026 Pg. 7, 55, 64; AR Pg. 51-53)</span>",
                    "<b>High Ex-Estate Cost of Production:</b> The 12-month ex-estate production cost is RM 305.98/MT (IDR 1,349,015/MT), exceeding the budget of RM 254.60/MT by 20%. This unfavourable variance is mainly driven by the 16% crop shortfall alongside higher upkeep and vehicle running costs. <span class='observation-ref'>(PA Report 2/2026 Pg. 8, 56-57, 61, 64)</span>",
                    "<b>Extended Harvesting Intervals, Loose Fruits & Hanging Fronds:</b> While the Agronomy visit noted a 9-day average interval with uncollected bunches in drains and 5-9% overripe bunches, the PA report highlighted that intervals lengthened to 13-24 days in April 2026 due to an earlier harvester shortage (135 harvesters; 1:21 ha) and rising crop patterns. This caused high loose fruit scatter on circles (requiring manuring workers to assist in collection) and hanging dried fronds as harvesters prioritized bunch cutting. By July 2026, harvester strength improved to 179 (1:16 ha) and two pilot Mini Tractor Grabber (MTG) gangs were introduced. <span class='observation-ref'>(PA Report 2/2026 Pg. 6-7, 17-18, 36, 38-39, 48-52; AR Pg. 21, 25)</span>",
                    "<b>Glyphosate Over-Spraying & Bare Ground Conditions:</b> Approximately 20% of the estate exhibits bare ground conditions due to a prolonged 3-month dry spell and indiscriminate over-spraying of Glyphosate (observed in fields DL23-12B1, DK23-12A1, and DL22-12A1). Tighter field supervision and sprayer training are urgently required, alongside improving sprayer productivity from 3.0 ha to 5.0 ha per man-day. <span class='observation-ref'>(PA Report 2/2026 Pg. 5, 26-28, 31, 63)</span>",
                    "<b>Flood-Prone Topography vs. Dry Spell Water Management:</b> Approximately 258.76 ha (26.86% of planted area) is low-lying and flood-prone during wet seasons, complicating fertilizer application and noxious weed management. Conversely, during the prolonged >3-month dry spell prior to August 2026, field collection drains were nearly dry, requiring careful water retention (50-75 cm below ground) and avoiding thick compost dumping in flood-prone zones. <span class='observation-ref'>(PA Report 2/2026 Pg. 6-7, 10, 44-46; AR Pg. 12-19, 43, 55)</span>",
                    "<b>Vehicle Running Costs & Agricultural Road Lateriting:</b> Vehicle and heavy machinery running costs generally exceeded budget due to high repair and maintenance expenses. Furthermore, Roads & Bridges expenditure exceeded budget by 46% (RM 431.25/ha vs RM 295.70/ha) due to soft soil conditions; management is urged to take advantage of dry weather to expedite laterite surfacing on raised collection roads. <span class='observation-ref'>(PA Report 2/2026 Pg. 6, 8, 41-42, 59-61, 64)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's overall performance during the 12-month review period (May 2025 to April 2026) is acceptable. Total FFB production was 22,647.49 MT (23.69 MT/ha), 16% below the budget of 26,997.89 MT (28.25 MT/ha). Consequently, ex-estate cost of production stood at RM 305.98/MT (IDR 1,349,015), 20% above the budget of RM 254.60/MT. During the August 2026 visit, Bpk Umar Syarif Hidayat replaced Bpk Joko Hidayat as Estate Manager. Management is urged to normalize extended harvesting intervals via the newly expanded harvester workforce and pilot mechanized infield collection (MTG), prevent Glyphosate over-spraying, and expedite road lateriting during dry weather. <span class='observation-ref'>(PA Report 2/2026, Pg. 4-10, 55-57, 63-65)</span>",
                        "Area Statement": "As of April 2026, there are no changes to the area statement. Total titled area is 1,067.93 ha, with total planted oil palm (Inti) at <b>958.78 ha</b> (89.78%) and non-cultivated area at 109.15 ha (58.59 ha building sites/roads and 50.56 ha water catchment/reservoirs):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Mature:</b> 955.80 ha (99.69% of planted area), comprising 128.82 ha (2008), 775.06 ha (2012), 45.16 ha (2013), and 6.76 ha (2020).</li><li><b>Immature:</b> 2.98 ha (0.31%, Block DG18-23A1 planted in 2023 with Lonsum material), scheduled for maturity declaration in April 2027 and consolidation with field G-18 2013A1.</li><li><b>Age Profile & Rehabilitation:</b> 98.99% of palms are in their prime stage (14 to 18 years old), 0.71% young mature, and 0.31% immature. No rehabilitation plans for the next financial year.</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 4, 11-14, 63)</span>",
                        "Labour Statement": "Combined workforce for Inti (958.78 ha) and Plasma (1,930.25 ha) covering 2,899.03 ha (2,886.45 ha mature):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Total Workers:</b> Stood at 345 workers in April 2026 vs requirement of 357 (ratio 1:8 ha), and increased to <b>388 workers</b> in July 2026 (ratio 1:7 ha, more than adequate).</li><li><b>Harvesters:</b> In April 2026, there were 135 harvesters (ratio 1:21 ha), which was inadequate for manual cutting/carrying against a requirement of 173. By July 2026, strength increased to <b>179 harvesters</b> (ratio 1:16 ha, adequate).</li><li><b>Upkeep & General (July 2026):</b> 36 manuring workers (1:80 ha, adequate), 30 spraying workers (1:97 ha, sufficient), 27 field general workers (loose fruit, water management, supplying/thinning), and 52 general workers (drivers, security, watchmen, clerks, workshop).</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 4, 17-18, 63)</span>",
                        "Staff Establishment": "The staff establishment remains unchanged and adequate, covering 2,899.03 ha (Inti and Plasma). It comprises 1 Estate Manager (Bpk Joko Hidayat as of April 2026; replaced by Bpk Umar Syarif Hidayat in August 2026), 5 Division Assistants (1:580 ha ratio), and 4 Field Conductors (1:725 ha ratio). Finance and Administration is headed by 1 KTU (Executive), supported by 1 Second Clerk, 1 Store Clerk, and 4 Checkroll Clerks. <span class='observation-ref'>(PA Report 2/2026, Pg. 4, 10, 15-16, 63)</span>",
                        "General Charges": "For the 12 months ended April 2026, General Charges (excluding Depreciation & Amortization) totaled <b>RM 2,054/ha</b> (IDR 9,055,413/ha; RM 1,969,245 total), which is <b>6% below</b> the annual budget of RM 2,174/ha (IDR 9,584,236/ha):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Notable Overspending (>10%):</b> Staff BPJS Employment (+23% or RM 49,999), Staff BPJS Health (+22% or RM 33,388), Staff Welfare & Benefits (+14% or RM 23,113), Staff Other Cost/THR (+95% or RM 54,880 due to Hari Raya bonuses), Water & Electricity (+18% or RM 18,703), Computer Maintenance (+265% or RM 1,083), General Insurance (+39% or RM 9,153), ISPO Expenses (+112% or RM 19,878 for PPE/signage), and Office General Repair & Maintenance (+347% or RM 58,428 for staff housing/office repairs).</li><li><b>Savings:</b> Offset by Labour Overhead (-47% or RM 283,436 below budget) and Depreciation & Amortization (-32% below budget at RM 1,747/ha vs RM 2,581/ha). Including depreciation, grand total General Charges were RM 3,801/ha (-20% vs budget RM 4,755/ha).</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 4, 19-21, 63, 66-67)</span>",
                        "Upkeep and Cultivation": "Total Upkeep & Cultivation expenditure for 12 months was <b>RM 3,826.51/ha</b> (IDR 16,870,488/ha; RM 3,657,356 total), which is <b>16% above</b> the budget of RM 3,292.48/ha (IDR 14,516,201/ha):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Weeding:</b> Total weeding cost was RM 122.79/ha (IDR 541,355), 1% below the budget of RM 123.96/ha. Circle & path spraying achieved 99% completion (1,904.92 ha / 2.0 rounds) at RM 37.08/ha (-19% vs budget RM 45.68/ha; RM 17.52/ha/round). Sprayer productivity using CKS nozzle (Inter Pump) was low at 3.0 ha/md (target 5.0 ha/md), and Glyphosate over-spraying caused bare ground in several blocks. Selective spraying achieved 89.04% (3,415.13 ha / 3.56 rounds out of 4.0 budgeted) at RM 85.71/ha (+9% vs budget RM 78.28/ha; RM 20.11/ha/round). Ground cover comprises 20% bare ground, 40% soft grass dominance, 20% soft grass mixed with noxious weeds, and 20% Stenochlaena/sedges/broadleaf dominance.</li><li><b>Manuring:</b> 100% completed (1,406.73 MT applied). Total cost was RM 2,089.31/ha (IDR 9,211,510), 8% above the budget of RM 1,933.85/ha due to fertilizer material costs exceeding budget by 13% (+RM 231.38/ha). Broadcast via wheelbarrow at 20 bags/md (target 25 bags/md).</li><li><b>Composting:</b> Cost was RM 931.32/ha (IDR 4,106,056), 49% above the budget of RM 623.28/ha as work volume exceeded budget. Applied via wheelbarrow at 140 kg per 2 palms (~10 MT/ha), achieving 40 points/md. Mechanization via rubber-tracked vehicles is recommended.</li><li><b>Pests & Diseases:</b> Cost was RM 26.66/ha (+52% vs budget RM 17.52/ha), primarily for rat baiting per agronomist recommendations. Minimal fresh rat attack, no bagworm outbreak, and negligible Ganoderma.</li><li><b>Pruning:</b> Progressive pruning completed 2,160.60 ha (75% of 2,867.40 ha budget, or 2.26 rounds out of 3.0) at RM 94.75/ha (-12% vs budget RM 107.91/ha). Dried hanging fronds appeared in blocks with extended harvesting intervals and must be removed once intervals normalize.</li><li><b>Roads & Bridges:</b> Cost was RM 431.25/ha (IDR 1,901,310), 46% above the budget of RM 295.70/ha due to soft soil requiring raising, compaction, and laterite surfacing. Main road grading completed 241,364 m (vs 213,400 m budget) at RM 0.15/m (-52% vs budget), plus 50 HK roadside pruning and 1 HDPE culvert unit (RM 5,111). Dry weather should be utilized to surface raised collection roads with laterite.</li><li><b>Drains & Soil/Water Conservation:</b> Drains cost RM 55.25/ha (64% of RM 86.45/ha budget), covering 4,030 m of unbudgeted new drain construction in the immature area (RM 3.50/m) and 8,241 m of drain desilting (20% of 40,787 m budget at RM 2.15/m). Soil/Water conservation cost RM 10.16/ha (31% of RM 33.08/ha budget) for flap gates, Bakau-wood weirs, and sandbag stops. Collection drains were mostly dry due to the >3-month dry spell; water levels should be maintained at 50-75 cm below ground.</li><li><b>Boundaries, Survey & Fences:</b> Zero expenditure and budget. Security patrols and boundary trenches are vital due to dispersed local settlements and FFB theft risks.</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 5-7, 22-47, 63-64)</span>",
                        "Harvesting and Collection": "For the 12-month period, total Harvesting & Collection cost (including external transport) was <b>RM 57.53/MT FFB</b> (IDR 253,664/MT), which is <b>5% below</b> the budget of RM 60.84/MT (IDR 268,215/MT). Excluding external transport (RM 13.18/MT), infield harvesting & collection was RM 44.35/MT (-7% vs budget RM 47.50/MT):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Harvesting Intervals & Loose Fruits:</b> Delayed in April 2026 at 1.0-2.0 rounds/month (13 to 24 days interval) due to an earlier harvester shortage (135 workers) and rising crop, leaving substantial loose fruits in palm circles. Manuring workers were deployed to assist in loose fruit recovery.</li><li><b>Harvester Productivity:</b> Improved significantly from 1.17-1.55 MT/md (prime) and 1.13 MT/md (young mature) in April 2026 to <b>2.08-2.33 MT/md</b> (prime) and <b>1.74 MT/md</b> (young mature) in July 2026, with daily earnings rising to RM 41.37-48.51 (above the RM 33.72 statutory minimum wage).</li><li><b>Mechanization Pilot:</b> In July 2026, two pilot mechanized FFB infield collection gangs using Mini Tractors with Grabbers (MTG - one with high-lift trailer, one with tipping trailer/bin system) were introduced in blocks DL23-12A1 and DK23-12A1 (each gang: 1 driver, 4 cutters, 4 helpers).</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 7, 48-54, 63-64)</span>",
                        "Crop Production": "For the 12 months ended April 2026 (FY 2025/26), FFB production totaled <b>22,647.49 MT</b>, which is <b>16% below</b> the annual budget of 26,997.89 MT and <b>18% below</b> FY 2024/25 actual production of 27,712.07 MT:<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Yield per Hectare:</b> 23.69 MT/ha actual vs 28.25 MT/ha budget (and 28.99 MT/ha in FY 2024/25) across 955.80 mature hectares.</li><li><b>CPO & PK Production:</b> CPO totaled 4,531.76 MT (4.74 MT CPO/ha) vs budget of 5,804.55 MT (6.07 MT/ha). Palm Kernel totaled 736.04 MT vs budget of 1,079.92 MT.</li><li><b>Extraction Rates:</b> OER achieved 20.01% (vs 21.50% budget and 21.00% last year); KER achieved 3.25% (vs 4.00% budget and 3.60% last year).</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 7, 55, 64)</span>",
                        "Production Cost": "Total Ex-Estate Cost of Production for the 12 months was <b>RM 305.98/MT FFB</b> (IDR 1,349,015/MT) or RM 1,515.49/MT CPO, which is <b>20% above</b> the budget of RM 254.60/MT FFB (IDR 1,122,495/MT):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>General Charges:</b> RM 86.95/MT FFB (+13% vs budget RM 77.20/MT).</li><li><b>Upkeep & Cultivation:</b> RM 161.49/MT FFB (+39% vs budget RM 116.56/MT).</li><li><b>Harvesting & Collection:</b> RM 44.35/MT FFB (-7% vs budget RM 47.50/MT).</li><li><b>Dispatch & Storage (External Transport):</b> RM 13.18/MT FFB (-1% vs budget RM 13.33/MT).</li><li><b>Overall Cost (Including Mill/HO/Depreciation):</b> Total before depreciation was RM 436/MT FFB (vs RM 351/MT budget), and Grand Total including depreciation (RM 74/MT) was RM 509/MT FFB (IDR 2,246,299/MT) vs budget RM 442/MT.</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 8, 56-57, 64)</span>",
                        "Vehicles Running Cost": "Operating costs across the estate's fleet were generally above budget due to high repair and maintenance costs:<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Jeeps & Farm Tractors:</b> Triton double cabin (JEP10) ran at RM 1.66/km (vs RM 1.24/km budget). Landini transporter tractor (WTR05) ran at RM 36.40/hr (vs RM 24.30/hr budget).</li><li><b>Mini Tractors & Crawlers (A411):</b> Averaged RM 42.37/hr (IDR 168,654/hr) vs budget of RM 22.50/hr across Yanmar EF-514T (RM 38.07-62.83/hr), Startrac (RM 28.19-45.82/hr), Dumper Crawler LY-3000 (RM 30.54-33.42/hr), and Ginga (RM 9.23-77.09/hr).</li><li><b>Heavy Road Machinery & Lorries:</b> Road Grader GD 511A ran at RM 149.40/hr (vs RM 62.80/hr budget), Bomag Roller at RM 153.90/hr (vs RM 51.70/hr budget), Backhoe Loader at RM 74.34/hr (vs RM 48.70/hr budget), Dump Truck at RM 4.34/km (vs RM 1.87/km budget), and Hino Bin Trucks averaged RM 3.93/km (vs RM 1.82/km budget). Strict adherence to preventive maintenance schedules is required.</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 8, 59-61, 64)</span>",
                        "Capital Expenditure": "Actual Capital Expenditure for the 12-month period was <b>RM 401,637</b> (IDR 1,770,766,210), representing <b>42%</b> of the annual budget of RM 960,136 (IDR 4,233,115,333):<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Access Road & Drainage Structures:</b> Totaled RM 393,585 (vs RM 464,731 budget), comprising 4m Collection Road laterite surfacing (RM 351,451), HDPE Flapgates DN800 (RM 13,992), HDPE Spiral Pipes ID800 (RM 11,562), 12-inch PVC Pipes (RM 9,832), and 1000mm Concrete Round Culverts (RM 6,748).</li><li><b>Other Capex:</b> Electricity supply (2.2 kW Water Pump) at RM 4,423 (100% of budget) and Workshop 10-Ton Jack at RM 3,629 (vs RM 4,261 budget). Budgeted Buildings (RM 23,952) and Dump Truck/Crawler purchases (RM 462,769) were not incurred.</li></ul><span class='observation-ref block mt-1'>(PA Report 2/2026, Pg. 8, 58)</span>",
                        "Immature": "Immature Field DG18-23A1 comprises <b>2.98 ha</b> planted in 2023 (125 SPH, 373 palms, Lonsum material) and will be declared mature at the end of the FY 2026/27 financial year (April 2027). Field ground conditions are satisfactory with weed-free palm circles and soft grasses dominating the interrows. Basal frond pruning has been completed and scout harvesting has commenced satisfactorily. <span class='observation-ref'>(PA Report 2/2026, Pg. 8, 11-12, 62)</span>"
                    },
                    "agronomy": {
                        "Executive Summary": "Overall agronomic conditions and upkeep practices have shown clear improvement, particularly regarding pruning and selective weed control. The FY2025/2026 FFB yield, however, declined by 18% to 23.69 MT/ha due to a lower bunch formation per palm. A notable success is the 100% completion of the fertilizer program and rat control stabilization. <span class='observation-ref'>(AR Pg. 12, 31, 39, 50, 53)</span>",
                        "Nutrient Inputs/Progress of Manuring": "The FY 2025/2026 fertilizer program was fully completed at 100% (applying 1,412.38 MT). Previous issues with lumpy fertilizer applications have been resolved. The estate is strongly advised to maintain proper frond stacking across undulating areas to limit runoff and improve nutrient uptake, moderating the strongly acidic soil pH (3.62-4.19). It is recommended to avoid dumping fresh compost in overly thick layers or in flood-prone areas to mitigate Ganoderma risks. <span class='observation-ref'>(AR Pg. 12-19)</span>",
                        "Agronomic Observation": "<ul class='list-disc ml-5 mt-1 space-y-1'><li><b>Harvesting:</b> Average harvesting interval is stable at 9 days. Harvester loose fruit collection improved, but the rate of overripe bunches remains high (5% - 9%). Uncollected bunches left inside field drains were observed and require stricter supervision.</li><li><b>Pruning:</b> Progressive pruning is 100% complete and highly satisfactory.</li><li><b>Ground Vegetation:</b> Significantly improved. Bracken ferns and noxious weeds have reduced drastically. Selective interrow spraying using mist blowers is recommended instead of blanket spraying.</li><li><b>P&D (Rats):</b> Rat damage is very minimal and well-controlled after successful baiting campaigns. Transitioning to second-generation rat baits is recommended.</li><li><b>Topography Challenge:</b> 258.76 ha (26.86% of total planted area) are recognized as flood-prone low-lying lands, compounding the difficulty of operations and weed management.</li></ul><span class='observation-ref block mt-1'>(AR Pg. 21-50, 67)</span>",
                        "Yield Performance": "The estate recorded a yield of <b>23.69 MT/ha</b> in FY 2025/2026, representing an 18% decline from the peak yield of 28.96 MT/ha in FY 2024/2025. Analysis shows this decline stems entirely from a significant 30.33% reduction in bunch numbers (down to 10.86 bunches per palm), which overshadowed a 17.06% increase in average bunch weight (up to 15.30 kg). <span class='observation-ref'>(AR Pg. 51-53)</span>",
                        "Fertilizer Recommendation": "No amendments were made to the upcoming FY 2026/2027 fertilizer program. Management is reminded that the fertilizer program must be strictly followed without deviation. Strict supervision is needed to ensure fertilizers are never applied when soils are waterlogged. <span class='observation-ref'>(AR Pg. 55-56)</span>"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Mechanization (FFB Collection & Composting)</p><p class='text-sm text-gray-600'><b>Policy Ref: MECH-FFB-01:</b> Estates with flat to undulating terrain are required to implement mechanized infield collection (Mini Tractor with Grabber / MTG or mini-crawlers) to improve evacuation efficiency, boost harvester outturn to 2.50-3.00 MT/md, and normalize harvesting intervals.</p></div> <div class='policy-item'><p class='font-semibold'>Weeding & Herbicide Management</p><p class='text-sm text-gray-600'><b>Policy Ref: WEED-GLY-02:</b> Glyphosate application must be strictly confined to the 2.0m palm circle and dense 1.2m harvester paths to prevent bare ground erosion. Noxious broadleaf weeds and Stenochlaena in interrows must be targeted selectively using Ally 20DF and/or Triclopyr via mist blower or high-volume CKS nozzle to establish soft grass and Nephrolepis dominance.</p></div> <div class='policy-item'><p class='font-semibold'>Pest Control (Rats)</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-01:</b> A rat census must be conducted quarterly. If fresh damage exceeds threshold levels, a baiting campaign using approved second-generation anticoagulants must be initiated and monitored at regular intervals.</p></div> <div class='policy-item'><p class='font-semibold'>Harvesting Intervals & Recovery</p><p class='text-sm text-gray-600'><b>Policy Ref: HARV-INT-02:</b> Harvesting intervals must be maintained below 15 days (ideally 10-12 days) to minimize overripe bunches and loose fruit scatter. All harvested crop, loose fruits, and bunches in drains must be evacuated on the same day, and hanging dried fronds removed concurrently.</p></div> <div class='policy-item'><p class='font-semibold'>Fertilizer & Water Management</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-APP-03:</b> Fertilizers must be broadcast evenly without deviation from the Agronomist's schedule, avoiding application during waterlogged or prolonged drought conditions. Drain water levels in tidal/flat areas must be maintained 50-75 cm below ground surface using flap gates and weirs.</p></div>"
            };

            // --- GLOBAL VARIABLES ---
            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            // --- FUNCTIONS ---
            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate(estateData);
                    populateInternalDropdowns(estateData);
                    attachEventListeners(estateData);
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Weeding') ? 'bg-purple-50 text-purple-800' : 'bg-teal-50 text-teal-800';
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    if (metric.type === 'chart') {
                        return `
                            <div class="p-4 rounded-lg ${colorClass} flex flex-col justify-between">
                                <h3 class="font-semibold mb-1">${metric.title}</h3>
                                <div class="relative w-full h-28 my-1">
                                    <canvas id="${metric.canvasId}"></canvas>
                                </div>
                                <div class="flex justify-center items-center space-x-4 mt-1 text-xs text-gray-600 font-medium">
                                    <span class="flex items-center"><span class="w-3 h-3 bg-[#16a34a] inline-block mr-1.5 rounded-sm"></span>Actual</span>
                                    <span class="flex items-center"><span class="w-3 h-3 bg-[#9ca3af] inline-block mr-1.5 rounded-sm"></span>Budget</span>
                                </div>
                                <p class="text-xs text-center text-green-700 italic mt-1 font-medium">${metric.note}</p>
                            </div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Annual FFB & CPO Production Comparison (MT)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details (Visit: August 2026)</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details (Visit: May 2026)</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const miniYieldCanvasId = 'miniYieldChart';
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                
                if (chartInstances[miniYieldCanvasId]) chartInstances[miniYieldCanvasId].destroy();
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();

                const miniYieldCtx = document.getElementById(miniYieldCanvasId)?.getContext('2d');
                if (miniYieldCtx) {
                    chartInstances[miniYieldCanvasId] = new Chart(miniYieldCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.miniYield.labels,
                            datasets: [
                                {
                                    label: 'Actual',
                                    data: estateData.chartData.miniYield.actual,
                                    backgroundColor: '#16a34a',
                                    borderRadius: 4,
                                    barPercentage: 0.7,
                                    categoryPercentage: 0.7
                                },
                                {
                                    label: 'Budget',
                                    data: estateData.chartData.miniYield.budget,
                                    backgroundColor: '#9ca3af',
                                    borderRadius: 4,
                                    barPercentage: 0.7,
                                    categoryPercentage: 0.7
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: { top: 22, bottom: 0, left: 5, right: 5 }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: { enabled: true },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    offset: 2,
                                    color: '#374151',
                                    font: { weight: 'bold', size: 11, family: 'Inter' },
                                    formatter: (value) => value !== null ? value.toFixed(2) : ''
                                }
                            },
                            scales: {
                                x: {
                                    grid: { display: false },
                                    ticks: { font: { size: 11, family: 'Inter' }, color: '#4b5563' }
                                },
                                y: {
                                    display: false,
                                    beginAtZero: true,
                                    max: 38
                                }
                            }
                        }
                    });
                }

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'FFB Production (MT)', data: estateData.chartData.production.ffb, backgroundColor: '#eab308', yAxisID: 'y-ffb', borderRadius: 4 },
                                { label: 'CPO Production (MT)', data: estateData.chartData.production.cpo, backgroundColor: '#3b82f6', yAxisID: 'y-cpo', borderRadius: 4 }
                            ]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: {
                                datalabels: { display: false }
                            },
                            scales: { 
                                x: { grid: { display: false } }, 
                                'y-ffb': { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: 'FFB Production (MT)' } }, 
                                'y-cpo': { type: 'linear', position: 'right', beginAtZero: true, title: { display: true, text: 'CPO Production (MT)' }, grid: { drawOnChartArea: false } } 
                            } 
                        }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#166534', '#15803d', '#16a34a', '#22c55e', '#4ade80'], hoverOffset: 4 }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { 
                                datalabels: { display: false },
                                title: { display: true, text: estateData.chartData.ageProfile.title, font: { size: 16 } }, 
                                legend: { position: 'right' } 
                            } 
                        }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<div class="mb-4"><h4 class="font-bold text-gray-800 text-base mb-1">${section}:</h4><div class="text-sm text-gray-700 leading-relaxed">${content}</div></div>`).join('');
                } else if (agronomyDiv) {
                    agronomyDiv.innerHTML = `<p class="text-sm text-gray-600">N/A</p>`;
                }

                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<div class="mb-4"><h4 class="font-bold text-gray-800 text-base mb-1">${section}:</h4><div class="text-sm text-gray-700 leading-relaxed">${content}</div></div>`).join('');
                } else if (plantationDiv) {
                    plantationDiv.innerHTML = `<p class="text-sm text-gray-600">N/A</p>`;
                }

                if (pinfosysDiv && estateData.reports.pinfosys === "Not Available") {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">N/A</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estateData));
            }

            renderEstate();
        });
        
        function openPolicyModal(estateData) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estateData.name}`;
            modalContent.innerHTML = estateData.policy;
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
