<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>South East Pahang Estate - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Plantation Analytics Portal
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <!-- Container where the estate data will be rendered -->
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for displaying policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Main script for application logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA STORE ---
            const estateData = {
                "id": "sepahang",
                "name": "South East Pahang Estate",
                "reportInfo": "Data based on PA Report (Visit June 2026), Agronomy Report (Visit May 2026) & Internal Audit Report (Visit 2026).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 1,522.07 ha",
                            "Mature: 1,522.07 ha (100%)",
                            "Immature: 0 ha",
                            "Unplanted: 96.66 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (Actual vs Budget)",
                        "value": "22.51 / 20.01 MT",
                        "note": "FY25/26 Full Year (PA Data)"
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne (Actual vs Budget)",
                        "value": "RM 281.75 / RM 296.90",
                        "note": "FY25/26 Ex-Estate (PA Data)"
                    },
                    "manuring": {
                        "title": "Manuring Status",
                        "value": "Completed",
                        "note": "88% budget achieved (PA)"
                    },
                     "pests": {
                        "title": "P&D Status",
                        "value": "Ganoderma 17.04%",
                        "note": "Mounding ongoing"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "Fertilizer Store", "value": "Wet Floor Conditions" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>", "label": "Harvest Interval", "value": "13-16 Days (Jun '26)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Pruning Prog.", "value": "100% (Completed)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Full Year Yield", "value": "22.51 MT/ha (FY25/26)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 7h1m-1 4h1m4-4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4' /></svg>", "label": "Ganoderma", "value": "17.04% Infection" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["P2005", "P2006", "P2007", "Total"],
                        "currentYear": [14.02, 18.54, 15.05, 16.10],
                        "prevYear": [14.07, 15.99, 15.57, 15.27], 
                        "note": "*Yield Comparison May-Nov FY2025/26 vs FY2024/25 (Source: AR Table 12)."
                    },
                    "ageProfile": {
                        "labels": ["P2005 (Old)", "P2006 (Prime)", "P2007 (Prime)"],
                        "data": [483.03, 614.23, 424.81],
                        "title": "South East Pahang Estate - Field Size (Ha)",
                        "note": "*Source: PA Report Table 1."
                    }
                },
                "observations": [
                    "<b>Ganoderma Infection & Management:</b> Infection rate remains a severe threat, currently recorded at 17.04% (including dead palms). Mounding has been recommended and is actively ongoing to extend the life of infected palms. <span class='observation-ref'>(PA Pg. 29, 34; AR Pg. 46)</span>",
                    "<b>Harvesting & Pruning Turnaround:</b> Harvesting intervals have been optimized to 13-16 days (from 20-26 days previously) thanks to successful contractor utilization, yielding an excellent harvester output of 3.06-3.38 MT/man-day. Additionally, progressive pruning is now 100% complete (3 rounds) across the estate. <span class='observation-ref'>(PA Pg. 32, 37-38)</span>",
                    "<b>Manuring & Weeding Progress:</b> The previously delayed manuring program is now completed (achieving 88% of the annual budget), and composting significantly exceeded targets at 161% completion. However, circle spraying remains slightly delayed at 62% completion. Wet fertilizer store conditions identified earlier still require mandatory pallet usage. <span class='observation-ref'>(PA Pg. 17, 24-26; AR Pg. 13-14)</span>",
                    "<b>Improper Trenching Practices (Agronomy Finding):</b> 'Slant cutting' of trenches toward harvesting paths (P05M) was observed, wrongly channeling fertilizer into trenches. Straight trenching parallel to rows is required. <span class='observation-ref'>(AR Pg. 16-18)</span>",
                    "<b>High Vehicle Running Costs:</b> Farm tractor and mini-tractor maintenance costs remain severely elevated, running up to 138% over budget due to major repairs and frequent breakdowns. Outsourcing or selling excess machinery is recommended. <span class='observation-ref'>(PA Pg. 42-43)</span>",
                    "<b>Payroll & Pruning Record Discrepancies (Audit Finding):</b> Significant mismatches were identified between the Piece Rate Book, Quarto System, and Daily Attendance Records. Management is taking rectifying actions following the estate assistant's resignation. <span class='observation-ref'>(Audit Report Pg. 1-6)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's performance is satisfactory. Crop production (34,259.92 MT) is 13% above budget, yielding 22.51 MT/ha. The cost of production (RM 281.75/MT) is 5% below budget. Harvesting and collection are successfully contracted. Management is advised to address high vehicle running costs and continue Ganoderma mounding. (PA Report, Pg. 44-46)",
                        "Area Statement": "As of April 2026, the total planted area is <b>1,522.07 ha</b>. This comprises:<br>• <b>Mature:</b> 1,522.07 ha (100%).<br>• <b>Immature:</b> 0 ha.<br>• <b>Replanting:</b> None planned for the next two financial years.<br>• <b>Unplanted:</b> 89.64 ha (roads) and 7.02 ha (buildings/orchards). (PA Report, Pg. 10)",
                        "Labour Statement": "Current workforce is 117 workers vs requirement of 129 (Ratio 1:13 ha).<br>• <b>Harvesters:</b> 62 workers (ratio 1:25 ha). 13 pruners can be deployed for harvesting.<br>• <b>Spraying:</b> 13 workers.<br>• <b>Manuring:</b> 10 workers.<br>• <b>Contractors:</b> Harvesting is fully contracted out (Purple Lavender) with 55 harvesters. (PA Report, Pg. 11-12)",
                        "Staff Establishment": "The staff establishment is adequate with 9 personnel, including 1 Senior Manager (Ts. Mohamed Rezal Bin Bakal), 1 Assistant Manager, 1 Chief Clerk, 1 Field Supervisor, and other support staff. There is a vacancy for 2 more Field Supervisors. (PA Report, Pg. 13)",
                        "General Charges": "Total General Charges are <b>RM 1,260.21/ha</b>, which is in line with the budget of RM 1,256.97/ha.<br>• <b>Overspending:</b> 'Staff Welfare and Benefits' (+488%), 'Upkeep Lines/Electricity' (+41%), 'Labour Recruitment' (+39%), and 'Security' (+40%).<br>• <b>Savings:</b> Overall charges remain satisfactory despite localized overspending. (PA Report, Pg. 14-15)",
                        "Upkeep and Cultivation": "• <b>Weeding:</b> Contracted out. Cost is RM 171.55/ha (24% below budget). Circle spraying is 62% complete (delayed).<br>• <b>Manuring:</b> Program slightly delayed (88% of budget at 1,905.70 MT) but completed during visit. Cost is RM 1,523.15/ha (5% below budget). Composting is 161% complete.<br>• <b>Pruning:</b> Progressive pruning successfully completed across the estate (3 rounds). Cost is RM 170.49/ha (11% below budget).<br>• <b>Pest & Disease:</b> Ganoderma infection rate is 17.04%. Bagworms are under control. No serious rat attack. (PA Report, Pg. 16-36)",
                        "Harvesting and Collection": "Total harvesting cost is <b>RM 84.45/MT</b>, which is 3% below the budget of RM 87.41/MT.<br>• <b>Interval:</b> Well-maintained within 13 to 16 days.<br>• <b>Productivity:</b> Harvester output is satisfactory at 3.06–3.38 MT/man-day.<br>• <b>Contracting:</b> Fully contracted out, which has been commendable. (PA Report, Pg. 37-39)",
                        "Crop Production": "FY2025/2026 (12 Months) FFB Production is <b>34,259.92 MT</b>, which is 13% above the budget of 30,453 MT.<br>• <b>Yield/Ha:</b> 22.51 MT/ha (vs budget 20.01 MT/ha).<br>• <b>Extraction:</b> OER at 19.42% vs Budget 19.50%. (PA Report, Pg. 40)",
                        "Production Cost": "Ex-estate Cost of Production is <b>RM 281.75/MT</b>, which is 5% favorable compared to the budget of RM 296.90/MT.<br>• <b>General Charges:</b> RM 55.99/MT (-11%).<br>• <b>Upkeep:</b> RM 141.32/MT (-4%).<br>• <b>Harvesting:</b> RM 84.45/MT (-3%). (PA Report, Pg. 41)",
                        "Vehicles Running Cost": "Average running costs generally exceeded the budgeted amount (ranging from 5% to 138% over) due to low usage and high repair costs. Recommendation to reduce or sell excess vehicles since harvesting and weeding are contracted out. (PA Report, Pg. 42-43)",
                        "Capital Expenditure": "N/A",
                        "Immature": "N/A (100% Mature Estate). (PA Report, Pg. 10)"
                    },
                    "agronomy": {
                        "Executive Summary": "Yield has improved to 16.10 MT/ha (May-Nov 2025), representing a 5% increase over the previous year. However, persistent SPH calculation errors exist. Manuring programs are heavily delayed (64% complete), and improper trenching practices are causing unnecessary nutrient loss. (AR Pg. 4-5)",
                        "Nutrient Inputs/Progress of Manuring": "Manuring FY2025/26 is 64% complete.<br>• <b>Delays:</b> Mix B was delayed due to stock/transport (received Nov 5).<br>• <b>Fertilizer Store:</b> Found with wet floors; fertilizers are being placed directly on the ground. Pallets must be strictly utilized. (AR Pg. 13-14)",
                        "Agronomic Observation": "<b>Field Maintenance:</b> Mounding is 39.3% complete. 'Slant cutting' of trenches toward harvesting paths (P05M) observed, wrongly channeling fertilizer into trenches. Straight trenching parallel to rows is required.<br>• <b>Harvesting & Crop Recovery:</b> High incidence of over-ripe bunches in P05F. Loose fruit collection contains high trash and rotten fruits.<br>• <b>Pruning:</b> Progress is unacceptably slow (34% vs target 4 rounds). Slightly under-pruned in P05A/M, P06A/D.<br>• <b>Weeding:</b> Soft grasses and ferns dominate. Localized woody weeds (Clidemia, Tetracera) are present in interrows.<br>• <b>Pests & Diseases:</b> Rat census for FY25/26 is not yet done. Barn Owl occupancy is low at 41%. Bagworm controlled. Ganoderma infection active; de-silting of mounds needed. (AR Pg. 16-46)",
                        "Yield Performance": "FY2024/25 total yield was 22.30 MT/ha. FY2025/26 (May-Nov) is currently at 16.10 MT/ha, marking a 5% improvement. (AR Pg. 48-49)",
                        "Fertilizer Recommendation": "N/A"
                    },
                    "audit": {
                        "Overall Opinion": "Satisfactory. The overall internal control systems governing the estate operations are satisfactory, although some weaknesses in the application of control procedures regarding payroll records were identified. (Audit Report Pg. 2)",
                        "Payroll and Personnel (Pruning Discrepancies)": "Multiple discrepancies were identified between the Piece Rate Book (PRB), Quarto Systems, and Daily Attendance Records for routine pruning operations: <br>• <b>Mismatched Records:</b> Worker Amir Hossain's transaction was voided in Quarto resulting in an 'Absent' status. 150 palms remain unpaid (RM 45).<br>• <b>Replacement Worker Tracing:</b> Worker Ramli Ahmad replaced an absent worker (Hatta Rudi), but the PRB was never amended, making the records inaccurate.<br>• <b>Inconsistent Rates:</b> For Block 2007G, the PRB was amended to RM 0.30/palm, but the Quarto system still processed it at the old RM 0.60/palm rate, causing an overpayment of RM 315. (Audit Report Pg. 2-4)",
                        "Variance with UAV Data": "In Block 2007D, routine pruning was paid for a total of 6,165 palms. However, reference data from July 2024 UAV records indicate the total palm count is only 5,989. This calculation error led to an overpayment for 176 excess palms (RM 52.80). (Audit Report Pg. 4-5)",
                        "Management Response & Action Plan": "The pruning irregularities stem from disorganized field practices and non-compliance with instructions. The assistant responsible submitted his resignation on Jan 14, 2026. Estate management is actively rectifying unorganized pruning areas to ensure systematic operations and payments every three months. Additionally, management is enforcing stricter checking of proof lists before processing Quarto data keys from mandores to prevent future over/underpayments. (Audit Report Pg. 6-7)"
                    },
                    "pinfosys": {
                        "CEO Financial Summary": "N/A",
                        "Summary of Oil Palm Expenditure": "N/A"
                    }
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Soil Conservation (Trenching)</p><p class='text-sm text-gray-600'><b>Policy Ref: SOIL-CONS-04:</b> Slant cutting of trenches is strictly prohibited on mineral soils. Trenches must be straight and parallel to planting rows to prevent fertilizer washout and root damage. <span class='observation-ref'>(AR Pg. 18)</span></p></div> <div class='policy-item'><p class='font-semibold'>Fertilizer Storage</p><p class='text-sm text-gray-600'><b>Policy Ref: STORE-FERT-01:</b> Fertilizers must never be placed directly on the floor. Pallets must be used to prevent moisture absorption, especially in stores with wet floor conditions. <span class='observation-ref'>(AR Pg. 14)</span></p></div> <div class='policy-item'><p class='font-semibold'>Pest Census (Rats)</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-01:</b> Rat damage census must be conducted quarterly. The absence of census data for FY25/26 prevents accurate infestation assessment. <span class='observation-ref'>(AR Pg. 46)</span></p></div>"
            };

            // --- GLOBAL VARIABLES ---
            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            // --- FUNCTIONS ---
            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Manuring') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Ganoderma') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Yield Comparison (May-Nov FY25/26 vs FY24/25)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Field Size Distribution (Ha)</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-audit" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Internal Audit Report Details</button>
                            <div id="${estate.id}-audit" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                     chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                {
                                    label: 'FY2025/26 (May-Nov)',
                                    data: estateData.chartData.production.currentYear,
                                    backgroundColor: '#16a34a', // Green
                                    borderColor: '#15803d',
                                    borderWidth: 1
                                },
                                {
                                    label: 'FY2024/25 (May-Nov)',
                                    data: estateData.chartData.production.prevYear,
                                    backgroundColor: '#ca8a04', // Yellow/Gold
                                    borderColor: '#a16207',
                                    borderWidth: 1
                                }
                            ]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            scales: { 
                                y: { 
                                    beginAtZero: true,
                                    title: { display: true, text: 'MT/Ha' }
                                } 
                            },
                            plugins: {
                                legend: { display: true },
                                title: { display: false }
                            }
                        }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx && estateData.chartData.ageProfile.data && estateData.chartData.ageProfile.data.length > 0) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ 
                                data: estateData.chartData.ageProfile.data, 
                                backgroundColor: ['#ca8a04', '#16a34a', '#15803d'], 
                                hoverOffset: 4 
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { 
                                title: { 
                                    display: false 
                                }, 
                                legend: { 
                                    position: 'right' 
                                } 
                            } 
                        }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const reportTypes = ['plantation', 'agronomy', 'audit', 'pinfosys'];
                
                reportTypes.forEach(type => {
                    const div = document.getElementById(`${estateData.id}-${type}`);
                    if (div && estateData.reports[type]) {
                        div.innerHTML = Object.entries(estateData.reports[type]).map(([section, content]) => `
                            <div class="mb-4">
                                <h4 class="font-bold text-gray-800 text-base mb-1">${section}:</h4>
                                <p class="text-sm text-gray-700 leading-relaxed">${content}</p>
                            </div>
                        `).join('');
                    } else if (div) {
                        div.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                    }
                });
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estateData));
            }

            renderEstate();
        });
        
        function openPolicyModal(estate) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estate.name}`;
            modalContent.innerHTML = estate.policy;
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
