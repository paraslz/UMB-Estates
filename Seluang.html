<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Seluang Estate - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; display: inline-block; margin-left: 0.25rem; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a h seeref="index.html" class="flex items-center">
                    Seluang Estate (Inti) Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300 font-medium">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <!-- Container where the estate data will be rendered -->
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for displaying policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Main script for application logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Register DataLabels plugin globally
            Chart.register(ChartDataLabels);

            // --- DATA STORE ---
            const estateData = {
                "id": "seluang",
                "name": "Seluang Estate (Inti)",
                "reportInfo": "Data based on PA Report (Visit: 20th to 21st August 2026) and Agronomy Report (Visit: 18th May 2026).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 1,246.27 ha",
                            "Mature: 1,116.66 ha",
                            "Immature: 129.61 ha",
                            "Unplanted: 1.71 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (MT)",
                        "type": "chart",
                        "canvasId": "miniYieldChart",
                        "note": "*FY 25/26 (May '25 - Apr '26)"
                    },
                    "cost": {
                        "title": "Ex-Estate Cost/Tonne",
                        "value": "RM 365 vs RM 346",
                        "note": "Actual vs Budget (+5.4%, PAR)"
                    },
                    "labour": {
                        "title": "Harvester Requirement",
                        "value": "58 vs 66 men",
                        "note": "Short of 8 harvesters (Ratio 1:9 ha)"
                    },
                     "agronomy": {
                        "title": "Planting Density",
                        "value": "122 SPH",
                        "note": "Low palm stand limits yield potential"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Harvester Prod.", "value": "Low (<6 hrs/day)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Harvest Interval", "value": "15 days" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>", "label": "Manuring Progress", "value": "226/261 Rounds" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-teal-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17.657 18.343A8 8 0 016.343 7.029m11.314 11.314a8 8 0 01-11.314-11.314' /></svg>", "label": "Palm Density", "value": "122 Palms/Ha (Low)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0' /></svg>", "label": "Crop Yield", "value": "12.96 MT/Ha (+18%)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z' /></svg>", "label": "Weed Control Output", "value": "Low (2.5-3ha/md)" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["FY 24/25", "FY 25/26"],
                        "ffb": [10.94, 12.96],
                        "note": "*FFB Yield (MT/Ha) comparison. (Source: PA Report 2/2026 Pg. 43)"
                    },
                    "ageProfile": {
                        "labels": ["0-3 Years (Immature)", "4-7 Years (Young Mature)", "8-19 Years (Prime)"],
                        "data": [4.3, 51.9, 43.8],
                        "title": "Seluang Estate - Age Distribution",
                        "note": "*Source: Agronomy Report 1/2026 Pg. 10."
                    }
                },
                "observations": [
                    "<b>Harvester Shortage & Productivity:</b> The estate is currently short of 8 harvesters (58 available vs 66 required), severely restricting potential crop recovery. Low productivity observed in 2017/2018 blocks due to short working hours (<6 hours/day). Mechanical infield collection trials with crawlers show promising productivity (3.5 ton/md). <span class='observation-ref'>(PA Report, Pg. 11, 40-42)</span>",
                    "<b>Low Planting Density:</b> The estate averages only 122 palms/ha, which is a key factor structurally limiting yield potential. Further supplying is urgently recommended for 2017-2020 plantings before full canopy closure. <span class='observation-ref'>(AR 1/2026 Pg. 10-12)</span>",
                    "<b>Crop Yield & Production Cost:</b> Yield for FY25/26 reached 12.96 MT/Ha, which is 8% below the budget (14.10 MT) but notably 18% higher than last year. Ex-estate production cost is elevated at RM 365/MT versus the budget of RM 346/MT, driven by overspending on Upkeep & Cultivation. <span class='observation-ref'>(PA Report, Pg. 43-45)</span>",
                    "<b>Massive Infrastructure Overspend:</b> 'Roads & Bridges' expenditure is 203% over budget. A large portion of capital expenditure for lateriting agricultural roads was incorrectly charged to Operational Expenditure, driving the overall OPEX variance. <span class='observation-ref'>(PA Report, Pg. 16, 33-34)</span>",
                    "<b>Weed Control & Spraying Inefficiencies:</b> Weeding is slightly delayed (Circle Spraying 68% complete). Worker output is extremely low (2.5 - 3 ha/md) partially due to sprayers wasting time refilling from block drains. Transitioning to Very Low Volume (VLV) nozzles and jerry-can supply is recommended. <span class='observation-ref'>(PA Report, Pg. 19-28; AR 1/2026 Pg. 42-44)</span>",
                    "<b>Nursery & Immature Area Management:</b> P2024 and P2025 plantings face challenges with high casualties and vacant points; re-census is required. In the pre-nursery, strict culling of abnormal seedlings (e.g., narrow leaf, twisted shoot) at 3-4 months is critical. Supplying has not commenced due to lack of seedling readiness. <span class='observation-ref'>(PAR Pg. 49-52; AR 1/2026 Pg. 21-25)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "Management priority must remain on increasing harvester and sprayer productivity. Due to a harvester shortage, crop production (14,472.34 MT) was 8% below budget. Ex-estate cost of production is over budget primarily due to excessive field upkeep and internal transport costs. Implementation of semi-mechanical fertilizer application and mechanical infield FFB collection is heavily encouraged. (PA Report, Pg. 6-8)",
                        "Area Statement": "As of April 2026, the total planted area is 1,246.27 ha against a total titled area of 2,376.60 ha. This comprises:<br>• <b>Mature:</b> 1,116.66 ha (46.99%).<br>• <b>Immature:</b> 129.61 ha (5.45%).<br>• <b>Vacant Land (Plantable):</b> 295.21 ha.<br>• <b>Unplanted Claims:</b> 1.71 ha belonging to villagers remaining to be planted pending seedlings. (PA Report, Pg. 4, 10)",
                        "Labour Statement": "Current total workforce is 166 workers vs a requirement of 168 (Ratio 1:9 ha).<br>• <b>Harvesters:</b> 58 available vs requirement of 66 (Shortage of 8). 9 new harvesters are scheduled to report in Sept.<br>• <b>Spraying:</b> 23 workers (Adequate).<br>• <b>Manuring:</b> 13 workers vs requirement of 16 (Short by 3), semi-mechanical application can offset this. (PA Report, Pg. 11-12)",
                        "Staff Establishment": "The staff establishment is deemed adequate. It consists of 7 personnel, managed by Bpk Ismanto Arga (Estate Manager). (PA Report, Pg. 13)",
                        "General Charges": "Total General Charges ended at RM 1,905,990, which is 24% below the budget of RM 2,496,170.<br>• <b>Overspending:</b> 'Other Building Maintenance' spiked by 100% due to under-budgeted repairs to workers' quarters and the construction of a tube well.<br>• <b>Savings:</b> Offset heavily by unspent budgets in Security (-74%), Staff Welfare (-49%), and Depreciation. (PA Report, Pg. 14-15)",
                        "Upkeep and Cultivation": "Total Upkeep was RM 3.20M vs Budget RM 2.93M (9% over budget).<br>• <b>Weeding:</b> Circle spraying (68% complete). Selective spraying (62% complete). Output is low at 2.5-3 ha/md. Switching to Very Low Volume (VLV) nozzles is advised.<br>• <b>Manuring:</b> 226 of 261 rounds completed. Compost progress was low (85.03/590 ha) due to a lack of workers.<br>• <b>Roads & Bridges:</b> Severely overspent (+203%) due to part of the Capital Expenditure being wrongly charged here. (PA Report, Pg. 16-37)",
                        "Harvesting and Collection": "YTD Cost is RM 66.69/MT, which is marginally higher (+3%) than the budget of RM 64.50/MT.<br>• <b>Internal Transport:</b> High costs incurred (RM 22.00/t vs budget RM 12.32/t) because the estate opted to use its own tractors more heavily instead of contract transporters.<br>• <b>Interval:</b> Averaged 15 days, strategically delayed during dry weather to avoid unripe bunches.<br>• <b>Mechanization:</b> Mini crawler trials prove effective with high harvester productivity (3.5 MT/md). (PA Report, Pg. 39-42)",
                        "Crop Production": "FY25/26 (12 Months) FFB Production is 14,472.34 MT, 8% below the budget of 15,746.12 MT.<br>• <b>Yield/Ha:</b> 12.96 MT/ha vs budget 14.10 MT/ha. Represents an 18% improvement over the prior year.<br>• <b>Extraction:</b> OER at 20.19% vs Budget 21.50%.<br>• <b>Bunch Weight:</b> Improved significantly across all ages compared to April 2025. (PA Report, Pg. 43-44)",
                        "Production Cost": "YTD Cost of Production Ex-Estate is RM 365/MT, which is unfavorable compared to the budget of RM 346/MT.<br>• <b>General Charges:</b> RM 76/MT (-20%).<br>• <b>Upkeep:</b> RM 222/MT (+19%).<br>• <b>Harvesting:</b> RM 67/MT (+5%). (PA Report, Pg. 45)",
                        "Vehicles Running Cost": "Vehicle costs are critically high for the tractor fleet (WTR02, WTR03, etc.) running at RM 33.88 - RM 34.50/hr, caused largely by extensive mechanical repair costs. Chief Clerk advised to strictly record running hours vs expenditures. (PA Report, Pg. 46-47)",
                        "Capital Expenditure": "Total CAPEX was generally underspent. 13,178 meters of road lateriting was successfully completed, but under HO instruction, a substantial portion of this cost was mistakenly booked into operational cost instead of CAPEX. (PA Report, Pg. 33-34, 48)",
                        "Immature": "Total 129.61 ha (100% Weeded). Both circle and selective spraying are fully completed across P2024 and P2025. Field conditions look pristine. Vacant point supplying is on hold awaiting readiness of seedlings from the nursery. (PA Report, Pg. 49-52)"
                    },
                    "agronomy": {
                        "Executive Summary": "Yield for FY25/26 improved to 12.97 MT/Ha but remains below expectations due to a structurally low planting density of 122 SPH. Crop recovery requires urgent attention due to substantial field losses from uncollected loose fruits and over-ripe bunches. Weed control has shifted towards an undesirable increase in bare ground due to over-spraying. The manuring program is 90% completed. (AR 1/2026, Pg. 13, 26, 42, 57)",
                        "Nutrient Inputs/Progress of Manuring": "The FY2025/2026 program is 90% completed with only minor delays.<br>• <b>Application Quality:</b> Management is reminded to properly break up any caked fertilizer to avoid uneven nutrient distribution.<br>• <b>Compost:</b> Application quality needs close monitoring to ensure proper decomposition vs raw EFB.<br>• <b>Frond Stacking:</b> Widespread implementation is recommended to reduce surface runoff and improve nutrient uptake. (AR 1/2026, Pg. 13-18)",
                        "Oil Palm Nursery & Immature": "The newly established pre-nursery shows good traceability.<br>• <b>Seedling Culling:</b> Strict culling of abnormal seedlings (narrow leaf, twisted shoot, collante) at 3-4 months is essential.<br>• <b>Immature (SM10-24A1):</b> Vacant points and dead palms persist despite supplying efforts; a re-census is advised. Past issues with compost placed too close to palm bases have been successfully rectified. (AR 1/2026, Pg. 20-25, 54-55)",
                        "Agronomic Observation": "The harvesting interval averaged 14 days against a 10-day target.<br>• <b>Harvesting Losses:</b> Field inspections revealed substantial losses from over-ripe and rotten bunches left on palms and uncollected loose fruits, particularly in SO12-17C1 and SN14-18B1.<br>• <b>Pruning:</b> Generally satisfactory, though minor over-pruning exists in shorter palms. Half-length frond cutting has significantly reduced.<br>• <b>Weed Control:</b> Woody plants have decreased, but sparse/bare ground is expanding. The estate must cease blanket spraying and encourage Nephrolepis or soft grasses.<br>• <b>Pests:</b> Rat damage varies; baiting is ongoing. (AR 1/2026, Pg. 26-53)",
                        "Yield Performance": "The FFB yield for FY 2025/2026 increased by 19% to 12.97 MT/Ha, up from 10.91 MT/Ha in FY24/25.<br>• <b>Bunch Weight:</b> Improved to an average of 11.14 kg/bunch.<br>• <b>Yield Constraint:</b> Production is structurally constrained by the estate's low palm stand density (122 SPH). A feasibility study on infilling for 2017-2020 plantings is strongly advised. (AR 1/2026, Pg. 57-60)",
                        "Fertilizer Recommendation": "There are no amendments to the FY 2026/2027 fertilizer program.<br>• <b>New Plantings:</b> Apply 600g of controlled-release fertilizer and 500g of RP in the planting hole.<br>• <b>Application Timing:</b> Fertilizer must not be applied during waterlogged conditions. Unfinished FY2026/2027 programs must not be carried past April 2027. (AR 1/2026, Pg. 65)"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Labour Productivity</p><p class='text-sm text-gray-600'><b>Policy Ref: LAB-PROD-01:</b> Harvester output should target >1.5 MT/md. If local harvesters consistently underperform, management must adjust the ratio of external recruits.</p></div> <div class='policy-item'><p class='font-semibold'>Weeding Technology</p><p class='text-sm text-gray-600'><b>Policy Ref: WEED-TECH-03:</b> Transition to Very Low Volume (VLV) or CDA (Controlled Droplet Application) for circle spraying in normal blocks to increase worker productivity to 6 ha/md.</p></div> <div class='policy-item'><p class='font-semibold'>Nursery Standards</p><p class='text-sm text-gray-600'><b>Policy Ref: NUR-SUP-07:</b> Only advanced seedlings with active new green spear growth are to be used for field supplying to ensure survival rates. Culling must strictly occur at month 3.</p></div> <div class='policy-item'><p class='font-semibold'>Infrastructure Costs</p><p class='text-sm text-gray-600'><b>Policy Ref: CAPEX-ROAD-01:</b> Major road lateriting and bridge rehabilitations in new areas must be capitalized rather than charged to operational upkeep to avoid artificial inflation of production costs.</p></div>"
            };

            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                // Generate UI cards for Summary Metrics
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    // Check if this metric dictates a mini chart
                    if (metric.type === 'chart') {
                        return `<div class="p-4 rounded-lg bg-green-50 text-green-900 border border-green-100 flex flex-col justify-between shadow-sm hover:border-green-200 transition">
                            <h3 class="font-semibold text-sm uppercase tracking-wider mb-2">${metric.title}</h3>
                            <div class="h-32 w-full relative"><canvas id="${metric.canvasId}"></canvas></div>
                            <p class="text-[11px] text-center text-green-700 mt-2 font-medium italic">${metric.note}</p>
                        </div>`;
                    }

                    // Standard text block metrics
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Labour') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    
                    let contentHTML = '';
                    if (metric.lines) {
                        contentHTML = metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('');
                    } else {
                        contentHTML = `<p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p>`;
                    }

                    return `<div class="p-4 rounded-lg ${colorClass} shadow-sm border border-transparent hover:border-gray-200 transition">
                        <h3 class="font-semibold text-sm uppercase tracking-wider mb-1">${metric.title}</h3>
                        ${contentHTML}
                    </div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                // Main HTML Assembly
                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-1 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">
                            ${summaryMetricsHTML}
                        </div>
                        
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                                <h3 class="text-xl font-semibold mb-2">Yield Performance Comparison</h3>
                                <div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div>
                                <p class="text-xs text-center text-gray-400 mt-4">${estate.chartData.production.note}</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                                <h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3>
                                <div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div>
                                <p class="text-xs text-center text-gray-400 mt-4">${estate.chartData.ageProfile.note}</p>
                            </div>
                        </div>
                        
                        <!-- Key Observations -->
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3>
                            <ul id="observations-list" class="list-disc list-inside space-y-3 text-gray-700 mt-4">${observationsHTML}</ul>
                        </div>
                        
                        <div class="mb-8 text-center">
                            <button class="policy-modal-btn bg-green-800 text-white px-8 py-3 rounded-lg hover:bg-green-900 transition shadow-lg font-medium">View Agricultural Policy Cross-Reference</button>
                        </div>
                        
                        <div class="space-y-3">
                            <button data-dropdown-id="plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-lg flex justify-between items-center hover:bg-gray-700 transition font-semibold">
                                Plantation Advisory Report Details
                                <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="plantation" class="details-content bg-white p-6 rounded-lg border border-gray-200 shadow-sm"></div>
                            
                            <button data-dropdown-id="agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-lg flex justify-between items-center hover:bg-gray-700 transition font-semibold">
                                Agronomy Report Details
                                <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="agronomy" class="details-content bg-white p-6 rounded-lg border border-gray-200 shadow-sm"></div>

                            <button data-dropdown-id="pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-lg flex justify-between items-center hover:bg-gray-700 transition font-semibold">
                                Pinfosys Report Details
                                <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="pinfosys" class="details-content bg-white p-6 rounded-lg border border-gray-200 shadow-sm"><p class="text-sm text-gray-600">Not Available</p></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                // 1. Setup the Mini Yield Chart equipped with DataLabels plugin
                const miniCtx = document.getElementById('miniYieldChart')?.getContext('2d');
                if (miniCtx) {
                    new Chart(miniCtx, {
                        type: 'bar',
                        data: {
                            labels: ['FY 24/25', 'FY 25/26'],
                            datasets: [
                                {
                                    label: 'Actual',
                                    data: [10.94, 12.96],
                                    backgroundColor: '#16a34a', // tailwind green-600
                                    borderRadius: 4,
                                    barPercentage: 0.6,
                                    categoryPercentage: 0.8
                                },
                                {
                                    label: 'Budget',
                                    data: [null, 14.10], // No budget mapped on screenshot for the previous year
                                    backgroundColor: '#9ca3af', // tailwind gray-400
                                    borderRadius: 4,
                                    barPercentage: 0.6,
                                    categoryPercentage: 0.8
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'bottom',
                                    labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'rectRounded', padding: 8 }
                                },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    color: '#4b5563', // tailwind gray-600
                                    font: { weight: 'bold', size: 11 },
                                    formatter: (value) => value ? value : '' // Hides null entries
                                },
                                tooltip: { enabled: false }
                            },
                            scales: {
                                x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                                y: { display: false, beginAtZero: true, suggestedMax: 18 } // Hide Y axis for minimalist look
                            },
                            layout: { padding: { top: 15 } }
                        }
                    });
                }

                // 2. Setup standard Bar Chart for Yield Performance
                const prodCtx = document.getElementById(`prodChart-${estateData.id}`).getContext('2d');
                new Chart(prodCtx, {
                    type: 'bar',
                    data: {
                        labels: estateData.chartData.production.labels,
                        datasets: [{ 
                            label: 'FFB Yield (MT/Ha)', 
                            data: estateData.chartData.production.ffb, 
                            backgroundColor: ['#d1fae5', '#16a34a'],
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        plugins: { legend: { display: false }, datalabels: { display: false } },
                        scales: { y: { beginAtZero: true, title: { display: true, text: 'MT/Ha', font: { weight: 'bold' } } } } 
                    }
                });

                // 3. Setup Doughnut Chart for Age Profile
                const ageCtx = document.getElementById(`ageChart-${estateData.id}`).getContext('2d');
                new Chart(ageCtx, {
                    type: 'doughnut',
                    data: {
                        labels: estateData.chartData.ageProfile.labels,
                        datasets: [{ 
                            data: estateData.chartData.ageProfile.data, 
                            backgroundColor: ['#064e3b', '#10b981', '#6ee7b7'],
                            borderWidth: 0
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        cutout: '65%',
                        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15 } }, datalabels: { display: false } } 
                    }
                });
            }
            
            function populateInternalDropdowns() {
                const pDiv = document.getElementById('plantation');
                pDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `
                    <div class="mb-5 last:mb-0">
                        <h4 class="font-bold text-gray-900 text-[15px] mb-1">${section}:</h4>
                        <div class="text-[14px] text-gray-700 leading-relaxed">${content}</div>
                    </div>`).join('');
                
                const aDiv = document.getElementById('agronomy');
                aDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `
                    <div class="mb-5 last:mb-0">
                        <h4 class="font-bold text-gray-900 text-[15px] mb-1">${section}:</h4>
                        <div class="text-[14px] text-gray-700 leading-relaxed">${content}</div>
                    </div>`).join('');
            }

            function attachEventListeners() {
                // Dropdown logic
                document.querySelectorAll('.dropdown-btn').forEach(btn => {
                    btn.addEventListener('click', e => {
                        const target = e.currentTarget;
                        const content = document.getElementById(target.dataset.dropdownId);
                        const isActive = content.classList.toggle('active');
                        target.classList.toggle('active', isActive);
                        
                        // Rotate arrow icon
                        const svg = target.querySelector('svg');
                        if (isActive) svg.style.transform = 'rotate(180deg)';
                        else svg.style.transform = 'rotate(0deg)';
                    });
                });

                // Modal opening
                document.querySelector('.policy-modal-btn')?.addEventListener('click', () => {
                    document.getElementById('modalContent').innerHTML = estateData.policy;
                    document.getElementById('policyModal').classList.add('active');
                });
            }

            // Init call
            renderEstate();
        });
        
        // Modal closure
        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
