<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Machap & Melaka Pinda Estate - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; } /* dark green */
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div id="header-title" class="text-xl font-bold text-gray-900">
                <!-- Title will be populated by JS -->
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <div class="container mx-auto p-4 md:p-8">
        <!-- Container where the estate data will be rendered -->
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA STORE ---
            const estateData = {
                "id": "machap",
                "name": "Machap & Melaka Pinda Estate",
                "reportInfo": "Data based on PA Report (Visit Date: 9th July 2026), Agronomy Report (Visit Date: 29th June 2026) & Audit Report (November 2025).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 1,014.82 ha",
                            "Machap Div: 722.58 ha",
                            "Melaka Pinda Div: 292.24 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (FY25/26 Actual vs Budget)",
                        "value": "21.93 MT / 23.96 MT",
                        "note": "8% below budgeted yield (PA Report)"
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne (Actual vs Budget)",
                        "value": "RM 302.95 / RM 297.06",
                        "note": "2% higher than budget (PA Report)"
                    },
                    "ganoderma": {
                        "title": "Ganoderma Status",
                        "value": "Critical (23% Affected)",
                        "note": "11% Dead, 12% Infected (Agronomy)"
                    },
                     "pests": {
                        "title": "Key Pests",
                        "value": "Rats",
                        "note": "Damage >10%, Low Barn Owl Occupancy (16%)"
                    }
                },
                "keyMetrics": [
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283-.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>`, "label": "Labour Ratio", "value": "1:11 ha (Adequate)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>`, "label": "P&D Status", "value": "High (Ganoderma, Rats)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>`, "label": "OER % (YTD)", "value": "19.32%" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>`, "label": "Harvester Prod.", "value": "1.5-2.2 MT/md (Low)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>`, "label": "Harvest Interval", "value": "11-19 Days" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12 12 0 0012 21.644a12 12 0 008.618-15.64z' /></svg>`, "label": "Manuring Prog.", "value": "100% Complete" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["FY 22/23", "FY 23/24", "FY 24/25", "FY 25/26"],
                        "ffb": [27.80, 27.45, 27.79, 21.93],
                        "rainfall": [1546.2, 969.5, 1509.0, 1500.0], 
                        "note": "*Historical Annual FFB yield. FY25/26 Yield declined to 21.93 MT/Ha. (Source: Agronomy Report 1-2026 Pg. 64)"
                    },
                    "ageProfile": {
                        "labels": ["0-3 (Immature)", "4-7 (Young Mature)", "8-19 (Prime)", "20-25 (Old)", ">26 (Old)"],
                        "data": [0, 18.8, 21.7, 46.0, 14.0],
                        "title": "Palm Age Profile (%)",
                        "note": "*Source: Agronomy Report 1/2026, Pg. 11"
                    }
                },
                "observations": [
                    "<b>Yield & Production Deficit (Blend):</b> FY25/26 yield concluded at 21.93 MT/ha, an 8% deficit against the budget (23.96 MT/ha) and a 21% drop from the previous year. While crop extraction (OER) is strong at 19.32%, total FFB production (22,258 MT) fell short due to harvester redeployment, lower bunch counts, and high MTG tractor breakdowns delaying infield collection. <span class='observation-ref'>(PA Pg. 43-46; AR 1-2026 Pg. 64-67)</span>",
                    "<b>Ganoderma Infection (Agronomy):</b> The estate faces a severe 23% Ganoderma infection rate (11% dead, 12% infected). Trunk chipping trials show deep internal tissue destruction before external symptoms appear. Mounding shows some root regeneration but carries high reinfection risks. <span class='observation-ref'>(AR 1-2026 Pg. 18-26)</span>",
                    "<b>Harvesting Standards & Mechanization (Blend):</b> Harvesting intervals averaged 11-19 days, but harvester productivity is notably low (1.5-2.2 MT/manday). A significant issue is the high breakdown rate of MTG tractors, leading to a 49% spike in infield loading costs over budget. EV Badang implementation in young palms is satisfactory, though capacity is underutilized. <span class='observation-ref'>(PA Pg. 39-43; AR 1-2026 Pg. 36-41)</span>",
                    "<b>Pest Control Challenges (Blend):</b> Rat damage remains above the 10% threshold in several blocks, requiring follow-up baiting. Compounding this, barn owl box occupancy is alarmingly low at 16% (7/44 boxes occupied), prompting a recommendation to source specialized boxes from \"The Bright Farm\" to improve occupancy. <span class='observation-ref'>(PA Pg. 28-29; AR 1-2026 Pg. 55-58)</span>",
                    "<b>Agronomic Upkeep (Blend):</b> The manuring program for the fiscal year is 100% completed. Pruning standards have noticeably improved across divisions. Circle spraying was deliberately delayed (53% complete) to save costs as ground conditions remained very good following mounding works. <span class='observation-ref'>(PA Pg. 17-32; AR 1-2026 Pg. 33-35, 42-47)</span>",
                    "<b>Internal Audit Findings (Audit):</b> Risks identified in FFB weighing (manual tare entry) and store management (duplicate codes, lubricant measurement). <span class='observation-ref'>(Audit Rpt Pg. 2-8)</span>"
                ],
                "reports": {
                    "agronomy": {
                        "Executive Summary": "Yield for FY25/26 declined by 21.1% to 21.93 MT/ha. Major limiting factors include severe Ganoderma infection (23%) and harvester redeployment affecting intervals. However, pruning and ground vegetation management have shown noticeable improvement. The manuring program achieved 99% completion despite some delivery delays. (Source: AR 1-2026, Pg. 4-7, 64-67)",
                        "Nutrient Inputs/Progress of Manuring": "FY25/26 manuring is 100% complete (1,180.86 MT applied). Minor delays occurred in NK and Mix B applications. Crucially, the fertilizer store continues to suffer from persistent wet floor conditions; installing a peripheral drain is strongly recommended. (Source: AR 1-2026, Pg. 33-35)",
                        "Agronomic Observation": "<b>Harvesting:</b> Averaged 2.1 rounds/month. Quality is acceptable (minimal overripe), but loose fruit collection contains excessive trash, and uncollected bunches were found in field drains. <br><b>Pruning:</b> Quality improved in both Machap and Melaka Pinda divisions; however, over-pruning was noted in young mature blocks (MC22, MP19A). <br><b>Weeding:</b> Well managed, dominated by soft grasses (<i>Axonopus compressus</i>). <br><b>Pest & Disease:</b> Rat damage exceeded 10% in certain blocks, necessitating a second baiting round. (Source: AR 1-2026, Pg. 36-63)",
                        "Yield Performance": "FY25/26 yield dropped to 21.93 MT/ha compared to 27.79 MT/ha in FY24/25. The decline is primarily due to a reduction in bunch numbers per palm (from 14 to 12). Young mature blocks (MC2020, MC2022) showed stable or slightly improved yields as they enter their prime. (Source: AR 1-2026, Pg. 64-67)",
                        "Fertilizer Recommendation": "The FY26/27 program is maintained. Any delayed applications from the previous year must not be carried forward beyond April 2027. New plantings should receive 600g controlled-release fertilizer (CRF) and 500g RP in the planting hole. (Source: AR 1-2026, Pg. 70, 81-83)"
                    },
                    "plantation": {
                        "Executive Summary": "The estate's performance is acceptable. Crop production (22,258.13 MT) is 8% below budget, and the cost of production (RM 302.95/MT) is 2% above budget. Replanting of 30.04 ha has started. Management must focus on enhancing harvester productivity, resolving vehicle breakdown issues, and addressing low barn owl occupancy. (PA Report, Pg. 4, 7, 8, 49)",
                        "Area Statement": "Total planted area is 1,014.82 ha. This comprises: <ul class='list-disc pl-5 mt-1'><li><b>Mature:</b> 1,014.82 ha (100%).</li><li><b>Replanting:</b> 30.04 ha (Field MP2003A). Felling and chipping commenced in July 2026.</li><li><b>Other Crops:</b> 5.78 ha (Stevia, pepper, durian) and 13.31 ha Pineapple on TNB Rentis.</li></ul> (PA Report, Pg. 10-11, 49)",
                        "Labour Statement": "Current workforce is 95 workers vs requirement (Ratio 1:11 ha), which is adequate. <ul class='list-disc pl-5 mt-1'><li><b>Harvesters:</b> 61 workers including MTG drivers (Ratio 1:17 ha).</li><li><b>Contractors:</b> Previous harvesting contractor terminated due to inability to adapt to the offered rates.</li></ul> (PA Report, Pg. 13-14, 49)",
                        "Staff Establishment": "The staff establishment is adequate with 5 personnel, including the Manager (Mr. Livindran A/L Ganesan), 2 Assistant Managers (one overseeing harvesting, the other cash crops), and 3 Field Supervisors. (PA Report, Pg. 12)",
                        "General Charges": "Total General Charges are <b>RM 1,739.46/ha</b>, which is perfectly in line with the budget of RM 1,740.16/ha. <ul class='list-disc pl-5 mt-1'><li><b>Overspending:</b> 'Labour Wages & Allowance' (+12%), 'Labour EPF' (+77% due to foreign worker unbudgeted costs), 'Welfare & Benefit' (+75%), and 'Recruitment' (+29%).</li></ul> (PA Report, Pg. 15-16)",
                        "Upkeep and Cultivation": "Total upkeep cost is RM 2,078.55/ha (14% below budget). <ul class='list-disc pl-5 mt-1'><li><b>Weeding:</b> Circle spraying deliberately delayed (53% complete) to save costs as ground conditions were acceptable following mounding. Cost is RM 223.85/ha (17% below budget).</li><li><b>Manuring:</b> 100% complete (1,180.86 MT applied).</li><li><b>Pest & Disease:</b> Cost is 44% below budget due to the absence of bagworms, but Barn Owl occupancy is very low at 16% (7/44 boxes).</li></ul> (PA Report, Pg. 17-35)",
                        "Harvesting and Collection": "Cost is RM 131.12/MT, slightly higher (6%) than the budget. <ul class='list-disc pl-5 mt-1'><li><b>Infield Loading:</b> Spiked by 49% (RM 23.14/MT vs budget RM 15.58) due to high MTG tractor breakdowns.</li><li><b>Interval:</b> Ranged from 11-19 days (tall palm area >15 days).</li><li><b>Productivity:</b> Low at 1.50 - 2.20 MT/manday. Target needs to be >3.0 MT.</li><li><b>Mechanization:</b> 4 MTG and 3 EV Badang tricycles used in young palms.</li></ul> (PA Report, Pg. 39-43)",
                        "Crop Production": "Total FFB Production (12 Months) is <b>22,258.13 MT</b>, which is 8% below the budget of 24,321.00 MT. <ul class='list-disc pl-5 mt-1'><li><b>Yield/ha:</b> 21.93 MT/ha.</li><li><b>Extraction:</b> OER at 19.32% vs Budget 18.02%.</li></ul> (PA Report, Pg. 45)",
                        "Production Cost": "Ex-Estate Cost of Production is <b>RM 302.95/MT</b>, which is 2% above the budget of RM 297.06/MT. <ul class='list-disc pl-5 mt-1'><li><b>General Charges:</b> RM 79.31/MT</li><li><b>Upkeep:</b> RM 92.48/MT</li><li><b>Harvesting:</b> RM 97.26/MT</li></ul> (PA Report, Pg. 46)",
                        "Vehicles Running Cost": "Vehicle costs are excessively high. <ul class='list-disc pl-5 mt-1'><li><b>Farm Tractors:</b> 5 units exceeded budget by 27% to 68%.</li><li><b>Mini Tractors:</b> 5 units exceeded budget by 82% to 213% due to low utilization and high breakdown/repair costs. Management urged to reassess or write off badly damaged units.</li></ul> (PA Report, Pg. 47-48, 51)",
                        "Capital Expenditure": "N/A",
                        "Immature": "N/A (100% Mature Estate prior to July 2026 replanting). (PA Report, Pg. 10)"
                    },
                    "pinfosys": "Not Available",
                    "audit": {
                        "Overall Rating": "Satisfactory. (Source: Audit Rpt, Pg. 1)",
                        "FFB Weighing Irregularities": "<b>Finding:</b> Irregularities in FFB weighing procedures at an external weighbridge (Hong Huei). Time-in/out stamps were only seconds apart due to the vendor's manual tare weight entry process. <br><b>Risk:</b> Poses a risk of weight manipulation, though no material variances were found. <br><b>Action:</b> Management will have escorting staff manually record time gaps and attach to weighbridge slips for verification. (Source: Audit Rpt, Pg. 2-5)",
                        "Stores Management Enhancement": "<b>Finding 1 (Stock Categorization):</b> Similar items (e.g., respirators, gloves) have duplicate stock codes in Quarto, causing confusion and count discrepancies. <br><b>Finding 2 (Lubricant Stock Count):</b> Stock counter used an unreliable method of 'shaking the drum' to estimate lubricant balances. <br><b>Action:</b> Management will review/reorganize stock codes and fabricate a calibrated dipstick for accurate lubricant measurement. (Source: Audit Rpt, Pg. 6-9)"
                    }
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Ganoderma Control</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Gano-01:</b> Mounding should be considered as a temporary mitigation measure to prolong the productive lifespan of infected palms. Replanting activities must follow Ganoderma Management SOP to minimize inoculum spread. (AR Pg. 26-32)</p></div> <div class='policy-item'><p class='font-semibold'>Fertilizer Storage</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-STORE-02:</b> Construct peripheral drains around fertilizer stores to prevent moisture ingress and resolve wet floor conditions. (AR Pg. 35)</p></div> <div class='policy-item'><p class='font-semibold'>Pest Control (Rats)</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-02a:</b> Conduct a post-baiting census after baiting is discontinued. If damage remains >10%, a second round of baiting must be executed. Maintain barn owl boxes annually. (AR Pg. 55-58)</p></div>"
            };

            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            // --- FUNCTIONS ---
            function renderEstate() {
                document.getElementById('header-title').innerText = `${estateData.name} Report`;
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate(estateData);
                    populateInternalDropdowns(estateData);
                    attachEventListeners(estateData);
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Ganoderma') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                const productionChartHTML = (estate.chartData.production.labels && estate.chartData.production.labels.length > 0) ?
                    `<div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div>` :
                    `<div class="chart-container flex items-center justify-center bg-gray-50 rounded-lg p-4"><p class="text-gray-500 text-center">A monthly Production vs. Rainfall chart cannot be generated as monthly FFB production data is not available in the reports.</p></div>`;
                
                const ageProfileChartHTML = (estate.chartData.ageProfile.data && estate.chartData.ageProfile.data.length > 0) ?
                    `<div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div>` :
                    `<div class="pie-chart-container flex items-center justify-center bg-gray-50 rounded-lg p-4"><p class="text-gray-500 text-center">Palm age profile data is not available in the provided reports.</p></div>`;

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Annual Yield vs Rainfall</h3>${productionChartHTML}<p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3>${ageProfileChartHTML}<p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3>
                            <ul id="observations-list" class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul>
                        </div>
                        
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-audit" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Internal Audit Report Details</button>
                            <div id="${estate.id}-audit" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx && estateData.chartData.production.labels.length > 0) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'FFB Yield (MT/Ha)', data: estateData.chartData.production.ffb, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', yAxisID: 'y-ffb', tension: 0.4 },
                                { label: 'Rainfall (mm)', data: estateData.chartData.production.rainfall, backgroundColor: '#3b82f6', yAxisID: 'y-rainfall' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, 'y-ffb': { type: 'linear', position: 'left', title: { display: true, text: 'FFB Yield (MT/Ha)' } }, 'y-rainfall': { type: 'linear', position: 'right', title: { display: true, text: 'Rainfall (mm)' }, grid: { drawOnChartArea: false } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx && estateData.chartData.ageProfile.data && estateData.chartData.ageProfile.data.length > 0) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#fde047', '#facc15', '#eab308', '#ca8a04', '#a16207'], hoverOffset: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: estateData.chartData.ageProfile.title }, legend: { position: 'right' } } }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                const auditDiv = document.getElementById(`${estateData.id}-audit`);
                
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<h4 class="font-semibold mt-4 text-gray-800">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4><p class="text-sm text-gray-600 mt-1">${content}</p>`).join('');
                }
                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<h4 class="font-semibold mt-4 text-gray-800">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4><div class="text-sm text-gray-600 mt-1">${content}</div>`).join('');
                }
                 if (pinfosysDiv && estateData.reports.pinfosys === "Not Available") {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600 mt-2">Not Available</p>`;
                }
                 if (auditDiv && estateData.reports.audit) {
                    auditDiv.innerHTML = Object.entries(estateData.reports.audit).map(([section, content]) => `<h4 class="font-semibold mt-4 text-gray-800">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4><p class="text-sm text-gray-600 mt-1">${content}</p>`).join('');
                } else if (auditDiv) {
                    auditDiv.innerHTML = `<p class="text-sm text-gray-600 mt-2">Not Available</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        const isActive = content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active', isActive);
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estateData));
            }

            renderEstate();
        });
        
        function openPolicyModal(estate) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estate.name}`;
            modalContent.innerHTML = estate.policy;
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
