<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Batu Anam Estate - Plantation, Agronomy & Audit Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Batu Anam Estate Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300 font-semibold">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <!-- Container where the estate data will be rendered -->
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for displaying policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="modalTitle" class="text-2xl font-bold text-gray-800">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-400 hover:text-red-600 text-3xl font-bold transition">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Main script for application logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA STORE ---
            const estateData = {
                "id": "batuanam",
                "name": "Batu Anam Estate",
                "reportInfo": "Data based on Planting Advisory Report 1/2026 (Visit: July 2026), Agronomy Report 1/2026 (Visit: June 2026) & Internal Audit Report (Visit: Mar 2026).",
                
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 795.56 ha",
                            "Mature: 627.46 ha",
                            "Replanting (Field 2025): 168.10 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (Actual vs Budget)",
                        "value": "18.69 / 21.43 MT",
                        "note": "Full Year FY25/26 (PA)"
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne (Actual vs Budget)",
                        "value": "RM 302 / RM 295",
                        "note": "Ex-Estate, Full Year FY25/26 (PA)"
                    },
                    "ganoderma": {
                        "title": "Ganoderma Status",
                        "value": "Severe (Up to 56%)",
                        "note": "Block 2003A2 heavily infected"
                    },
                     "pests": {
                        "title": "Key Pests",
                        "value": "Barn Owl Occupancy Low",
                        "note": "48% occupied. Rats minimal."
                    }
                },
                
                "keyMetrics": [
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>`, "label": "Labour Ratio (PA)", "value": "1:15 ha (Adequate)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>`, "label": "Harvester Prod. (PA)", "value": "1.04 - 2.02 MT/md (Low)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>`, "label": "OER % (FY25/26)", "value": "19.06% (Budget 19.5%)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>`, "label": "Harvest Interval", "value": "11-12 days (Satisfactory)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-orange-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10 M13 8h6a1 1 0 011 1v7l-2.5-1-2.5 1' /></svg>`, "label": "MTG Productivity", "value": "12.09 MT/day (Low)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17.657 18.343A8 8 0 016.343 7.029m11.314 11.314a8 8 0 01-11.314-11.314m2.121 13.435a2 2 0 01-2.828 0l-2.122-2.121a2 2 0 010-2.828l5.656-5.657a2 2 0 012.829 0l2.121 2.121a2 2 0 010 2.828l-5.657 5.657z' /></svg>`, "label": "Weeding Prog. (PA)", "value": "Delayed (Circle 71%)" }
                ],
                
                "chartData": {
                    "production": {
                        "labels": ["May-25", "Jun-25", "Jul-25", "Aug-25", "Sep-25", "Oct-25", "Nov-25", "Dec-25", "Jan-26", "Feb-26", "Mar-26", "Apr-26"],
                        "ffb": [977, 977, 977, 977, 977, 977, 977, 977, 977, 977, 977, 977], // Avg based on PA 12-month total 11,729.40 MT
                        "budget": [1120, 1120, 1120, 1120, 1120, 1120, 1120, 1120, 1120, 1120, 1120, 1120], // Avg based on PA 12-month budget 13,444 MT
                        "note": "*Chart shows monthly average based on 12-month PA totals (May 2025 - April 2026)."
                    },
                    "ageProfile": {
                        "labels": ["Immature/Replant (0-3 yrs)", "Young Mature (4-7 yrs)", "Prime (8-19 yrs)", "Old Mature (>20 yrs)"],
                        "data": [168.10, 70.05, 61.74, 495.67], // Derived from PA Pg. 10 planting years
                        "title": "Batu Anam Estate - Palm Age Distribution (Ha)",
                        "note": "*Source: PA Report 1/2026, Pg. 10. Majority of estate (62%) comprises old mature palms."
                    }
                },
                
                "observations": [
                    "<b>Ganoderma Infection:</b> Severe infection up to 56% in Block 2003A2, heavily exacerbated by flood-prone areas. Mounding has been completed, but desilting is urgently required. <span class='observation-ref'>(PA 1/26, Pg. 30; AR 1/26, Pg. 28-29)</span>",
                    "<b>Low Harvester & MTG Productivity:</b> Harvesters are achieving only 1.04-2.02 MT/md, and MTGs at 12.09 MT/day, both well below optimum. This results in lower worker income and inflates infield loading costs by 30%. Discrepancies in MTG weighing data persist. <span class='observation-ref'>(PA 1/26, Pg. 39-42; Audit Report, Pg. 2-6)</span>",
                    "<b>Weeding Standards & Delays:</b> Circle spraying is delayed (71% complete). Selective spraying was overspent due to required repair work on noxious weeds. Spray coverage in replanting areas remains unsatisfactory. <span class='observation-ref'>(PA 1/26, Pg. 17-23; AR 1/26, Pg. 31-37)</span>",
                    "<b>Barn Owl Occupancy:</b> While rat damage is currently minimal and controlled, barn owl box occupancy is exceptionally low at 48% (12 of 25 boxes). Additional boxes are needed to reach the 1:20 ha ratio. <span class='observation-ref'>(PA 1/26, Pg. 28-29; AR 1/26, Pg. 38-40)</span>",
                    "<b>Crop Production Shortfall:</b> The estate achieved 11,729.40 MT (13% below budget), driving the ex-estate cost of production up to RM 302/MT (2% above budget). <span class='observation-ref'>(PA 1/26, Pg. 43-44)</span>",
                    "<b>Replanting Supplying (Field 2025):</b> Palm survival post-flood is acceptable, but a thorough census must be conducted immediately to supply vacant spots and dead palms to maximize future yield. <span class='observation-ref'>(PA 1/26, Pg. 47; AR 1/26, Pg. 43-46)</span>"
                ],
                
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's overall performance during the review period is acceptable. Crop production (11,729.40 MT) was 13% below budget, leading to an ex-estate cost of production (RM 302/MT) that was 2% above budget. Priority must be placed on improving spraying quality, manuring productivity, and crucially, harvester output. (PA Report 1/2026, Pg. 49-51)",
                        "Area Statement": "As of April 2026, total planted area stands at <b>795.56 ha</b>. This comprises:<br>• <b>Mature:</b> 627.46 ha (78.87%).<br>• <b>Immature:</b> 0 ha.<br>• <b>Replanting:</b> 168.10 ha (Field 2025 - 21.13%). No further replanting is scheduled for the next financial year as the oldest palms are still yielding. (PA Report 1/2026, Pg. 9-10)",
                        "Labour Statement": "The estate employs 54 workers against a requirement of 59 (Shortage: 5). The overall labour ratio is 1:15 ha, which is adequate.<br>• <b>Harvesters:</b> 24 (Ratio 1:26 ha). Slightly inadequate; recommendation to add 6 harvesters to reach 1:22 ha before high crop season.<br>• <b>Sprayers:</b> 9 workers.<br>• <b>Manuring:</b> 4 workers. (PA Report 1/2026, Pg. 12-13)",
                        "Staff Establishment": "The staff establishment is adequate with 5 personnel, including 1 Estate Manager (En Mohd Saiful Bin Mohammad Noh), 1 Assistant Manager, 1 Field Supervisor, and 2 Clerks. An additional Field Supervisor is recommended. (PA Report 1/2026, Pg. 11)",
                        "General Charges": "Total General Charges expenditure was <b>RM 1,618/ha</b>, which is 5% below the budget of RM 1,696/ha.<br>• <b>Overspending:</b> Staff EPF (+15% due to bonus), Labour EPF (+52% due to foreign worker contributions), and Labour Paid Leave (+15%).<br>• <b>Savings:</b> Offset by general control over other administrative headers. (PA Report 1/2026, Pg. 14-15)",
                        "Upkeep and Cultivation": "• <b>Weeding:</b> Circle spraying is delayed (71% complete) at RM 220/ha (21% below budget). Selective spraying was completed but overspent significantly due to excess repair work.<br>• <b>Manuring:</b> 100% complete for the year. Cost is RM 1,156/ha (7% below budget).<br>• <b>Pest & Disease:</b> Cost is low at RM 54/ha (28% of budget) due to minimal rat attacks. However, Barn Owl occupancy is low at 48% (12/25 boxes). (PA Report 1/2026, Pg. 16-30)",
                        "Harvesting and Collection": "The overall harvesting cost is <b>RM 76.20/MT</b>, strictly in line with budget.<br>• <b>Infield Loading:</b> Spiked to RM 16.39/MT (30% over budget) due to MTG breakdowns and repair costs.<br>• <b>Interval:</b> Maintained satisfactorily at 11-12 days.<br>• <b>Productivity:</b> Harvester output (1.04-2.02 MT/md) and MTG output (12.09 MT/day) are both considered low and require proactive management. (PA Report 1/2026, Pg. 38-42)",
                        "Crop Production": "Actual FFB production for the 12-month period was <b>11,729.40 MT</b>, which is 13% below the budget of 13,444.00 MT.<br>• <b>Yield/Ha:</b> 18.69 MT (Budget: 21.43 MT).<br>• <b>Extraction:</b> Oil Extraction Rate (OER) stood at 19.06% against a budget of 19.50%. (PA Report 1/2026, Pg. 43)",
                        "Production Cost": "The ex-estate cost of production is <b>RM 302/MT</b>, which is 2% higher than the budget of RM 295/MT.<br>• The higher cost is heavily driven by the FFB crop production falling 13% below the budgeted volume. (PA Report 1/2026, Pg. 44)",
                        "Vehicles Running Cost": "Vehicle costs exceeded budgets in specific areas.<br>• <b>Mini Tractors (MTG):</b> Average operating costs exceeded the budgeted amount due to low utilization hours combined with high repair costs. Farm tractors remained within budget. (PA Report 1/2026, Pg. 45-46)",
                        "Immature (Replanting)": "<b>Replanting (Field 2025):</b> 168.10 ha replanting completed in July 2025. Palms have survived recent floods well. However, weed spray coverage is unsatisfactory. A census is urgently required to supply vacant spots and dead palms. Total development cost to date is RM 8,960/ha. (PA Report 1/2026, Pg. 47-48)"
                    },
                    "agronomy": {
                        "Executive Summary": "FFB Yield for FY25/26 was 18.69 MT/ha (maintained from previous year's 18.62 MT/ha). Yield constraints remain heavy due to a low average stand density (115 SPH) and a highly old-mature palm profile (62.3%). Key issues needing urgent attention are deteriorating weeding standards, rising Ganoderma infections in flood-prone areas, and an increase in uncollected harvested bunches. (AR 1/2026, Pg. 9, 31, 47)",
                        "Nutrient Inputs & Progress of Manuring": "• <b>Progress:</b> FY25/26 program (Mixture B, RP, Kieserite) is 100% completed with delays ranging from 0-4 months.<br>• <b>Storage:</b> Conditions improved significantly with dry floors and durable pallets used in stores.<br>• <b>Application:</b> The estate is strongly advised to avoid 'slant cutting' of trenches for mounding, as this causes excessive root damage and fertilizer wastage from runoff.<br>• <b>Mechanization:</b> EMDEK spreaders must only be used in blocks with >100 SPH; blocks with lower densities require manual application. (AR 1/2026, Pg. 12-14)",
                        "Agronomic Observation": "• <b>Pruning:</b> Generally satisfactory, with notable improvements in previously under-pruned blocks P03B1 and P03B2. Slight over-pruning was observed in P17A & P17B.<br>• <b>Weeding:</b> Ground vegetation control has deteriorated and is below standard across most sub-blocks. Undesirable weeds (<i>Clidemia hirta, Asystasia</i>) and giant VOPs (P17A) are present and require immediate eradication.<br>• <b>Pest & Disease:</b> Rat damage has been successfully controlled to 4%. Barn owl box occupancy increased substantially to 80% (Note: Discrepancy with PA report). Ganoderma symptoms (unopened spears, frond snapping) remain prevalent.<br>• <b>Water Management:</b> No desilting work was carried out in FY25/26, which is urgently needed for the 413 ha (39%) of flood-prone areas to manage Ganoderma spread. (AR 1/2026, Pg. 22-42)",
                        "Yield Performance": "• <b>Yield:</b> FY25/26 actual yield was 18.69 MT/ha.<br>• <b>Harvesting:</b> Harvesting intervals are acceptable (10-17 days). However, underripe bunches have increased, and uncollected harvested bunches were spotted in the field.<br>• <b>Loose Fruits:</b> Collection quality has deteriorated, with high amounts of trash and rotten fruits found in bags, requiring much better field supervision. (AR 1/2026, Pg. 17-21, 47)",
                        "Agronomic Observations for 2025/2026 Replanting": "• <b>Progress:</b> Replanting of 168.10 ha (Field 2025) was completed in Nov 2025.<br>• <b>Survival:</b> Palms planted on 'burger bunds' showed excellent survival rates following recent severe floods.<br>• <b>Maintenance:</b> Minor erosion around planting platforms ('tapping' shape) needs prompt re-mounding. SPH should be calculated based on gross planted area (146 SPH) for accurate supply monitoring. (AR 1/2026, Pg. 43-46)",
                        "Fertilizer Recommendation": "The FY2026/2027 program is provided. For new plantings or supplies, apply 600g CRF and 500g RP in the planting hole. (AR 1/2026, Pg. 52)"
                    },
                    "audit": {
                         "Overall Audit Status": "IAD has rated Batu Anam Estate as <b>Satisfactory</b>. Although some weaknesses in the application of control procedures were identified, they were not sufficiently critical to compromise the system of internal control. (Audit Report, Pg. 1-2)",
                         "Mechanization & MTG Productivity": "<b>Inconsistent MTG Productivity During Low FFB Season:</b><br>• <b>Data Discrepancies:</b> Reconciliation revealed consistent variances between MTG vehicle running distribution records and daily FFB collection reports (e.g., a 35 MT variance in Jan 2026, and 31 MT in Oct 2025).<br>• <b>Low Productivity:</b> MTG daily productivity was relatively low and fluctuated heavily, despite 2 units being fully operational. The lowest recorded productivity of a single MTG was 2.97 MT on 7 March 2026.<br>• <b>Causes:</b> The variances arose due to a lack of monthly reconciliation and cross-checking by management between final weights and daily allocations. Low FFB volume also naturally drove productivity down.<br>• <b>Recommendations:</b> Ensure all MTG records are verified/reconciled monthly. Segregate daily FFB collection reports by MTG unit. Consider roadside FFB collection (manual loading) during extreme low crop seasons.<br>• <b>Management Response:</b> The discrepancies stem from clerical recording errors mapping manual vs MTG loading. Due to the low season, management stated they monitor MTG productivity by <i>hectarage coverage</i> rather than pure tonnage to avoid extra harvester demands. (Audit Report, Pg. 2-6)"
                    },
                    "pinfosys": "Not Available"
                }
            };

            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate(estateData);
                    populateInternalDropdowns(estateData);
                    attachEventListeners(estateData);
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Ganoderma') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg shadow-sm ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg shadow-sm ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-600 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg shadow-sm">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4 pl-1">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Monthly Production (MT)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition font-semibold">Plantation Advisory Report Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200"></div>
                            
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition font-semibold">Agronomy Report Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200"></div>
                            
                            <button data-dropdown-id="${estate.id}-audit" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition font-semibold">Internal Audit Report Details</button>
                            <div id="${estate.id}-audit" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200"></div>

                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition font-semibold">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'Actual Avg (MT)', data: estateData.chartData.production.ffb, backgroundColor: '#3b82f6', borderRadius: 4 },
                                { label: 'Budget Avg (MT)', data: estateData.chartData.production.budget, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: false, title: { display: true, text: 'Monthly Production (MT)' } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#fde047', '#4ade80', '#22c55e', '#15803d'], hoverOffset: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: estateData.chartData.ageProfile.title, font: { size: 16 } }, legend: { position: 'bottom' } } }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const auditDiv = document.getElementById(`${estateData.id}-audit`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                
                // Helper to format sections exactly like the requested image template
                const formatSection = (title, content) => {
                    return `<div class="mb-5">
                                <h4 class="font-bold text-gray-900 text-[15px] mb-1.5">${title}:</h4>
                                <p class="text-sm text-gray-700 leading-relaxed">${content}</p>
                            </div>`;
                };

                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => formatSection(section, content)).join('');
                } else if (agronomyDiv) {
                    agronomyDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => formatSection(section, content)).join('');
                } else if (plantationDiv) {
                    plantationDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (auditDiv && estateData.reports.audit) {
                    auditDiv.innerHTML = Object.entries(estateData.reports.audit).map(([section, content]) => formatSection(section, content)).join('');
                } else if (auditDiv) {
                    auditDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (pinfosysDiv && estateData.reports.pinfosys === "Not Available") {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', openPolicyModal);
            }

            renderEstate();
        });
        
        function openPolicyModal() {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const policyData = ` <div class='policy-item'><p class='font-semibold text-gray-800'>Flood Mitigation (Replanting)</p><p class='text-sm text-gray-600 mt-1'><b>Ref: AR 1/2026:</b> Use 'Burger Bunds' (3-6ft elevation) for planting points in flood-prone areas. Map flood levels annually.</p></div> <div class='policy-item'><p class='font-semibold text-gray-800'>Pest Control (Ganoderma & Rats)</p><p class='text-sm text-gray-600 mt-1'><b>Policy Ref: P&D-Gano-01:</b> Annual census required. Maintain barn owl boxes and perform de-silting in low-lying areas to reduce palm stress from waterlogging.</p></div> <div class='policy-item'><p class='font-semibold text-gray-800'>Manuring (Mounding)</p><p class='text-sm text-gray-600 mt-1'><b>Ref: AR 1/2026:</b> Construct mounds by digging trenches between planting rows. Avoid 'slant cutting' to reduce massive fertilizer run-off.</p></div> <div class='policy-item'><p class='font-semibold text-gray-800'>Harvesting Productivity</p><p class='text-sm text-gray-600 mt-1'><b>Ref: PA 1/2026:</b> Harvesters achieving below 1.8 MT/day should be reviewed for training. Prevent leaving uncollected bunches in the fields.</p></div> <div class='policy-item'><p class='font-semibold text-gray-800'>Data Reconciliation</p><p class='text-sm text-gray-600 mt-1'><b>Ref: Internal Audit (Mar 2026):</b> Daily vehicle running logs must be reconciled against final weighbridge tickets monthly to ensure cost-per-tonne accuracy.</p></div>`;
            modalTitle.innerText = 'Agricultural Policy Cross-Reference: Batu Anam';
            modalContent.innerHTML = policyData;
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
